:20px}header button{font-size:12px;padding:8px}}@media(max-height:550px) and (orientation:landscape){header h1{font-size:24px}.scores{margin:5px 0}.score{padding:4px}.tile{min-height:8vh;padding:4px}.cat{padding:4px}.panel{margin:10px auto}}
</style><main><header><h1>BEAT THE BOARD</h1><div><button id="sound">Sound off</button> <button id="new">New game</button></div></header><div id="app"></div></main><script>
const BANK=[{"cat":0,"citation":"28 TAC §34.515; TDI registration and fee information","correct":"C","difficulty":"Easy","explanation":"The initial main-office registration fee is $450. Do not confuse it with the $600 two-year renewal fee or the $100 initial branch-office fee.","id":"TFM01-FOCUSED-001","options":[{"key":"A","text":"$100"},{"key":"B","text":"$250"},{"key":"C","text":"$450"},{"key":"D","text":"$600"}],"question":"What is the current initial fee for a main-office Fire Extinguisher Certificate of Registration?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.515","correct":"D","difficulty":"Easy","explanation":"The main-office certificate renews for two years at $600. Older study material often says $300 annually; that describes the same annualized amount but is not the current fee presentation.","id":"TFM01-FOCUSED-002","options":[{"key":"A","text":"$200"},{"key":"B","text":"$300"},{"key":"C","text":"$450"},{"key":"D","text":"$600"}],"question":"What is the current two-year renewal fee for a main-office Fire Extinguisher Certificate of Registration?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.510(g); §34.515","correct":"B","difficulty":"Easy","explanation":"The initial branch-office certificate costs $100 and is not prorated. Its expiration is aligned with the main office's certificate.","id":"TFM01-FOCUSED-003","options":[{"key":"A","text":"$70"},{"key":"B","text":"$100"},{"key":"C","text":"$200"},{"key":"D","text":"$250"}],"question":"What is the initial registration fee for a branch office?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.515","correct":"C","difficulty":"Moderate","explanation":"The branch-office renewal fee is $200 for two years. The $100 figure is the initial branch fee, which is a common exam trap.","id":"TFM01-FOCUSED-004","options":[{"key":"A","text":"$100"},{"key":"B","text":"$150"},{"key":"C","text":"$200"},{"key":"D","text":"$300"}],"question":"What is the two-year branch-office renewal fee?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.515","correct":"C","difficulty":"Easy","explanation":"A Type C registration initially costs $250. Type C is the firm registration connected with DOT-specification cylinder testing, not an individual extinguisher license.","id":"TFM01-FOCUSED-005","options":[{"key":"A","text":"$100"},{"key":"B","text":"$150"},{"key":"C","text":"$250"},{"key":"D","text":"$300"}],"question":"What is the initial fee for a Type C hydrostatic-testing registration?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.515","correct":"D","difficulty":"Moderate","explanation":"The Type C renewal fee is $300 for two years. Older cards may describe this as $150 annually, so read whether the question asks for the current two-year fee.","id":"TFM01-FOCUSED-006","options":[{"key":"A","text":"$150"},{"key":"B","text":"$200"},{"key":"C","text":"$250"},{"key":"D","text":"$300"}],"question":"What is the two-year renewal fee for a Type C hydrostatic-testing registration?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.515","correct":"C","difficulty":"Easy","explanation":"The initial individual license fee is $70. The $100 amount is the two-year renewal fee, while $30 is the apprentice-permit fee.","id":"TFM01-FOCUSED-007","options":[{"key":"A","text":"$20"},{"key":"B","text":"$30"},{"key":"C","text":"$70"},{"key":"D","text":"$100"}],"question":"What is the initial fee for an individual Type PL, A, B, or K license?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.515; TDI Apprentice Permit information","correct":"B","difficulty":"Easy","explanation":"The apprentice-permit fee is $30. An apprentice permit does not require an examination, but the apprentice must work under direct visual supervision.","id":"TFM01-FOCUSED-008","options":[{"key":"A","text":"$20"},{"key":"B","text":"$30"},{"key":"C","text":"$70"},{"key":"D","text":"$100"}],"question":"What is the fee for an apprentice permit?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.515; TDI licensing information","correct":"B","difficulty":"Moderate","explanation":"The fee is $20. This covers a replacement or a required revision; it is different from an initial license or renewal fee.","id":"TFM01-FOCUSED-009","options":[{"key":"A","text":"$10"},{"key":"B","text":"$20"},{"key":"C","text":"$35"},{"key":"D","text":"$70"}],"question":"What fee applies to a duplicate or revised certificate, license, or permit?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.510(h)(1)","correct":"C","difficulty":"Moderate","explanation":"A total ownership change invalidates the existing certificate, so the new owners must apply 14 days before the change to keep the business operating continuously. This is a before-the-change deadline.","id":"TFM01-FOCUSED-010","options":[{"key":"A","text":"On the day of the change"},{"key":"B","text":"Within 14 days after the change"},{"key":"C","text":"14 days before the change"},{"key":"D","text":"30 days before the change"}],"question":"A firm will undergo a total ownership change. When should the new owners submit the application for a new certificate?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.510(i)","correct":"C","difficulty":"Moderate","explanation":"A corporate-officer change must be reported in writing within 14 days. It does not by itself require a new or revised certificate.","id":"TFM01-FOCUSED-011","options":[{"key":"A","text":"Immediately by telephone"},{"key":"B","text":"Within 5 business days"},{"key":"C","text":"Within 14 days"},{"key":"D","text":"At the next renewal"}],"question":"How soon must a change in corporate officers be reported to the state fire marshal?","topic":"Money & Deadlines"},{"cat":0,"citation":"28 TAC §34.510(k)","correct":"B","difficulty":"Difficult","explanation":"These changes require a revised certificate. The registered firm must send written notice and the required fee within 14 days after the change.","id":"TFM01-FOCUSED-012","options":[{"key":"A","text":"Wait until renewal"},{"key":"B","text":"Submit written notice and the revision fee within 14 days"},{"key":"C","text":"Apply for an entirely new certificate 30 days beforehand"},{"key":"D","text":"Notify only the local AHJ"}],"question":"A firm's name, physical location, or mailing address changes. What is required?","topic":"Money & Deadlines"},{"cat":1,"citation":"28 TAC §34.511(a)(1)","correct":"D","difficulty":"Easy","explanation":"Type PL is the planning license and covers planning, supervising, certifying, installing, or servicing fixed systems other than pre-engineered systems. Type A may install or service such systems but does not perform the planning function.","id":"TFM01-FOCUSED-013","options":[{"key":"A","text":"Type B"},{"key":"B","text":"Type K"},{"key":"C","text":"Type A"},{"key":"D","text":"Type PL"}],"question":"Which license can plan non-pre-engineered fixed fire extinguisher systems?","topic":"License Types"},{"cat":1,"citation":"28 TAC §34.511(a)(3); TDI FEL-B information","correct":"A","difficulty":"Easy","explanation":"That is the Type B portable-extinguisher license. DOT-specification cylinder testing still requires a Type C registered company.","id":"TFM01-FOCUSED-014","options":[{"key":"A","text":"Type B"},{"key":"B","text":"Type K"},{"key":"C","text":"Type A"},{"key":"D","text":"Type PL"}],"question":"Which license primarily covers servicing, certifying, and low-pressure hydrostatic testing of portable extinguishers?","topic":"License Types"},{"cat":1,"citation":"28 TAC §34.511(a)(4)","correct":"B","difficulty":"Easy","explanation":"Type K covers installing, certifying, or servicing pre-engineered cooking-area systems and also covers portable extinguishers. Type C is a company registration for DOT-specification hydrostatic testing.","id":"TFM01-FOCUSED-015","options":[{"key":"A","text":"Type B"},{"key":"B","text":"Type K"},{"key":"C","text":"Type C"},{"key":"D","text":"Type PL only"}],"question":"Which license is specifically for pre-engineered fixed systems protecting cooking areas?","topic":"License Types"},{"cat":1,"citation":"28 TAC §34.511(a)(2)","correct":"C","difficulty":"Moderate","explanation":"Type A covers fixed-system installation/service work and all pre-engineered fixed systems, plus certifying and servicing portables. It does not include planning non-pre-engineered systems; that belongs to Type PL or a professional engineer.","id":"TFM01-FOCUSED-016","options":[{"key":"A","text":"Planning every non-pre-engineered system"},{"key":"B","text":"Only portable-extinguisher inspections"},{"key":"C","text":"Certifying or servicing non-pre-engineered fixed-system installations and installing, certifying, or servicing pre-engineered systems"},{"key":"D","text":"Only DOT-specification hydrostatic testing"}],"question":"What work is authorized by a Type A license?","topic":"License Types"},{"cat":1,"citation":"28 TAC §34.510(c); TDI Type C information","correct":"D","difficulty":"Moderate","explanation":"Type C is a firm registration for DOT-specification cylinder testing. It is not an individual Type A, B, K, or PL license.","id":"TFM01-FOCUSED-017","options":[{"key":"A","text":"Authorizing an apprentice"},{"key":"B","text":"Planning fixed systems"},{"key":"C","text":"Operating a branch office"},{"key":"D","text":"Hydrostatically testing DOT-specification extinguisher cylinders"}],"question":"What is the purpose of a Type C registration?","topic":"License Types"},{"cat":1,"citation":"TDI Apprentice Permit information; 28 TAC §34.512","correct":"B","difficulty":"Easy","explanation":"An apprentice works under direct visual supervision, and the supervising licensee certifies the work by signing the required tag or document. The permit itself has no examination requirement.","id":"TFM01-FOCUSED-018","options":[{"key":"A","text":"Alone after 30 days"},{"key":"B","text":"Under direct visual supervision of a valid licensee who certifies the work"},{"key":"C","text":"Under telephone supervision"},{"key":"D","text":"Only after passing TFM01"}],"question":"How may an apprentice install or service extinguishers or systems?","topic":"License Types"},{"cat":1,"citation":"28 TAC §34.511(e)(4)","correct":"C","difficulty":"Moderate","explanation":"The usual prerequisite is six months holding an apprentice permit or Type B license. Qualifying out-of-state fixed-system service licensure can also satisfy the experience provision.","id":"TFM01-FOCUSED-019","options":[{"key":"A","text":"Only a driver's license"},{"key":"B","text":"A branch certificate"},{"key":"C","text":"An apprentice permit or Type B license"},{"key":"D","text":"A Type C registration"}],"question":"Before receiving a Type A or Type K license, an applicant generally must have held what for at least six months?","topic":"License Types"},{"cat":1,"citation":"28 TAC §34.511(e)(1)","correct":"C","difficulty":"Easy","explanation":"No. A licensee must be employed by a registered firm and hold an unexpired license while performing regulated business activities.","id":"TFM01-FOCUSED-020","options":[{"key":"A","text":"Yes, with customer permission"},{"key":"B","text":"Yes, for cash jobs only"},{"key":"C","text":"No"},{"key":"D","text":"Only on weekends"}],"question":"May a licensee perform regulated extinguisher work while not employed by a registered firm?","topic":"License Types"},{"cat":1,"citation":"28 TAC §34.511(e)(2)","correct":"D","difficulty":"Moderate","explanation":"A license is neither temporarily nor permanently transferable. The license belongs to the person to whom it was issued.","id":"TFM01-FOCUSED-021","options":[{"key":"A","text":"Yes, temporarily"},{"key":"B","text":"Yes, with the employer's consent"},{"key":"C","text":"Only between family members"},{"key":"D","text":"No"}],"question":"Can an individual fire-extinguisher license be transferred to another person?","topic":"License Types"},{"cat":1,"citation":"28 TAC §34.511(b)","correct":"B","difficulty":"Easy","explanation":"A licensee must be able to show proof of licensure while working. The current rule no longer depends solely on a wall license or a particular paper format.","id":"TFM01-FOCUSED-022","options":[{"key":"A","text":"A purchase receipt"},{"key":"B","text":"Proof of licensure"},{"key":"C","text":"A copy of the customer's insurance"},{"key":"D","text":"A city business permit only"}],"question":"What must a licensee be able to show while engaged in regulated work?","topic":"License Types"},{"cat":1,"citation":"28 TAC §34.511(e)(3)","correct":"C","difficulty":"Moderate","explanation":"The registered firm has 14 days after termination to notify the state fire marshal. This is separate from the licensee's own duty to revise a firm or mailing-address change.","id":"TFM01-FOCUSED-023","options":[{"key":"A","text":"Within 24 hours"},{"key":"B","text":"Within 5 business days"},{"key":"C","text":"Within 14 days"},{"key":"D","text":"At the next renewal"}],"question":"How soon must a registered firm notify the state fire marshal after a licensee's employment ends?","topic":"License Types"},{"cat":1,"citation":"TDI FEL-B licensing information","correct":"C","difficulty":"Difficult","explanation":"FEL-B requires the Extinguisher Statutes and Rules test, TFM01, and the technical Type B test, TFM02. TFM03 is the kitchen-system test and TFM04 is the Type A test.","id":"TFM01-FOCUSED-024","options":[{"key":"A","text":"TFM01 only"},{"key":"B","text":"TFM02 only"},{"key":"C","text":"TFM01 and TFM02"},{"key":"D","text":"TFM01, TFM03, and TFM04"}],"question":"Which tests are required for an FEL-B portable-extinguisher license?","topic":"License Types"},{"cat":2,"citation":"28 TAC §34.510(a)","correct":"B","difficulty":"Easy","explanation":"Every firm and every branch office engaged in the regulated business needs its own certificate. A branch certificate is tied to the same business but is still required for the separate location.","id":"TFM01-FOCUSED-025","options":[{"key":"A","text":"Only the main office"},{"key":"B","text":"Each firm and each branch office engaged in the business"},{"key":"C","text":"Only firms with more than five employees"},{"key":"D","text":"Only Type C firms"}],"question":"Who must obtain a certificate of registration?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.510(b)-(c)","correct":"A","difficulty":"Moderate","explanation":"A registered firm must have at least one licensed person who is properly equipped to perform the work authorized by the certificate. The firm's permitted activity is limited by the licenses held by its employees.","id":"TFM01-FOCUSED-026","options":[{"key":"A","text":"Employ at least one properly equipped licensed person"},{"key":"B","text":"Employ a professional engineer in every case"},{"key":"C","text":"Have two apprentices"},{"key":"D","text":"Have a full-time local fire marshal"}],"question":"Before beginning business, what staffing requirement must a registered firm satisfy?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.510(d)","correct":"C","difficulty":"Easy","explanation":"The business location must be a physical address, not merely a mailing address or P.O. box. The specific business location is shown on the certificate.","id":"TFM01-FOCUSED-027","options":[{"key":"A","text":"A P.O. box"},{"key":"B","text":"A private mailbox"},{"key":"C","text":"A physical address"},{"key":"D","text":"Any email address"}],"question":"What kind of address must appear as a registered firm's business location?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.510(e)","correct":"B","difficulty":"Moderate","explanation":"The shop can be at the specific business location or in a mobile unit designed for servicing, repairing, or hydrostatic testing. Either way, it must be adequately equipped for all work the firm performs.","id":"TFM01-FOCUSED-028","options":[{"key":"A","text":"Only in a permanent commercial building"},{"key":"B","text":"At the business location or in a properly designed mobile unit"},{"key":"C","text":"Only at the state fire marshal's office"},{"key":"D","text":"Only inside a branch office"}],"question":"A registered firm's shop may be located where?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.510(e)(1)-(3)","correct":"A","difficulty":"Moderate","explanation":"The shop must keep the most recently adopted NFPA 10, along with current Chapter 6001 and the applicable state rules. Manufacturer manuals or parts lists are also required for the extinguishers serviced.","id":"TFM01-FOCUSED-029","options":[{"key":"A","text":"The most recently adopted NFPA 10"},{"key":"B","text":"Only the local building code"},{"key":"C","text":"NFPA 13 only"},{"key":"D","text":"A manufacturer's sales catalog"}],"question":"Which reference must a portable-extinguisher service shop maintain?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.510(f)","correct":"B","difficulty":"Moderate","explanation":"Vehicles regularly used for installation, service, maintenance, testing, or certification must display the company name, phone number, and registration number. The identification must appear prominently on both sides.","id":"TFM01-FOCUSED-030","options":[{"key":"A","text":"Employee name and home address"},{"key":"B","text":"Company name, telephone number, and certificate-of-registration number"},{"key":"C","text":"Only the company logo"},{"key":"D","text":"License plate and insurance policy number"}],"question":"Which set correctly lists the identification required on regularly used business vehicles?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.510(f)","correct":"B","difficulty":"Difficult","explanation":"The required letters and numbers must be at least one inch high and permanently affixed or magnetically attached to both sides in a contrasting color.","id":"TFM01-FOCUSED-031","options":[{"key":"A","text":"At least one-half inch"},{"key":"B","text":"At least one inch"},{"key":"C","text":"At least two inches"},{"key":"D","text":"No minimum size"}],"question":"How large must the required lettering and numbers be on a regularly used business vehicle?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.510(f)","correct":"C","difficulty":"Easy","explanation":"The certificate number must appear as “TX ECR-number.” FEL identifies an individual license type, not the firm's vehicle registration format.","id":"TFM01-FOCUSED-032","options":[{"key":"A","text":"TX LIC-number"},{"key":"B","text":"SFMO-number"},{"key":"C","text":"TX ECR-number"},{"key":"D","text":"FEL-number"}],"question":"What is the required format for displaying the extinguisher registration number on a business vehicle?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.514(a)(4)","correct":"B","difficulty":"Moderate","explanation":"A Type C application must include the U.S. DOT letter registering the facility and assigning the facility's registration number. This connects the state registration to DOT cylinder-testing authorization.","id":"TFM01-FOCUSED-033","options":[{"key":"A","text":"A local fire-department recommendation"},{"key":"B","text":"A U.S. DOT letter registering the facility and issuing its registration number"},{"key":"C","text":"A Type K license"},{"key":"D","text":"An NFPA membership card"}],"question":"What must accompany an application for a Type C certificate?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.514(a)(5); Insurance Code §6001.154","correct":"B","difficulty":"Moderate","explanation":"The liability policy must include products and completed operations coverage, and proof must remain on file with SFMO. Failure to maintain required insurance can jeopardize the firm's registration.","id":"TFM01-FOCUSED-034","options":[{"key":"A","text":"Workers' compensation only"},{"key":"B","text":"Products and completed operations coverage"},{"key":"C","text":"Automobile collision only"},{"key":"D","text":"Life insurance for every employee"}],"question":"What insurance coverage must be included in a firm's proof of liability insurance?","topic":"Firm Rules"},{"cat":2,"citation":"Texas Insurance Code §6001.154","correct":"B","difficulty":"Moderate","explanation":"Chapter 6001 requires at least $100,000 combined bodily-injury and property-damage coverage per occurrence and $300,000 aggregate per policy year. These are minimum statutory limits.","id":"TFM01-FOCUSED-035","options":[{"key":"A","text":"$50,000 per occurrence and $100,000 aggregate"},{"key":"B","text":"$100,000 per occurrence and $300,000 aggregate"},{"key":"C","text":"$300,000 per occurrence and $1 million aggregate"},{"key":"D","text":"$1 million for every occurrence"}],"question":"What are the statutory minimum liability limits for a registered firm?","topic":"Firm Rules"},{"cat":2,"citation":"28 TAC §34.510(g)","correct":"B","difficulty":"Difficult","explanation":"Branch-office expiration and renewal dates are aligned with the registered firm's main-office certificate. This prevents every branch from running on a separate renewal calendar.","id":"TFM01-FOCUSED-036","options":[{"key":"A","text":"One year after each branch opens"},{"key":"B","text":"On the same date as the main office certificate"},{"key":"C","text":"Every December 31"},{"key":"D","text":"Only when the branch changes address"}],"question":"When do branch-office certificates expire and renew?","topic":"Firm Rules"},{"cat":3,"citation":"28 TAC §34.521(a)","correct":"C","difficulty":"Easy","explanation":"A completed red tag indicates that corrective action or replacement is necessary because the equipment is unsafe or inoperable. A normal service tag must not be attached until the impairment is corrected.","id":"TFM01-FOCUSED-037","options":[{"key":"A","text":"A service tag"},{"key":"B","text":"A yellow inventory tag"},{"key":"C","text":"A red tag"},{"key":"D","text":"No tag until repairs are authorized"}],"question":"What tag is required when an extinguisher or fixed system is unsafe or inoperable?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.521(a)","correct":"A","difficulty":"Moderate","explanation":"The registered firm must notify the owner or representative immediately and provide written notice describing all impairments. The separate AHJ deadlines are 24 hours and three business days.","id":"TFM01-FOCUSED-038","options":[{"key":"A","text":"Immediately"},{"key":"B","text":"Within 3 business days"},{"key":"C","text":"Within 5 business days"},{"key":"D","text":"At the next annual inspection"}],"question":"When unsafe or inoperable equipment is found, how soon must the owner or owner's representative be notified?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.521(a)","correct":"B","difficulty":"Moderate","explanation":"The AHJ must be notified within 24 hours by phone, fax, or email when available. This initial notice is followed by a copy of the owner's written notice within three business days.","id":"TFM01-FOCUSED-039","options":[{"key":"A","text":"Immediately, before leaving the property"},{"key":"B","text":"Within 24 hours"},{"key":"C","text":"Within 3 business days"},{"key":"D","text":"Within 14 days"}],"question":"When available, how soon must the local AHJ receive the initial phone, fax, or email notice of an unsafe or inoperable condition?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.521(a)","correct":"B","difficulty":"Moderate","explanation":"The AHJ must receive a copy within three business days. Do not confuse this with the five-business-day deadline after a red tag is removed or revised.","id":"TFM01-FOCUSED-040","options":[{"key":"A","text":"One"},{"key":"B","text":"Three"},{"key":"C","text":"Five"},{"key":"D","text":"Fourteen"}],"question":"Within how many business days must a copy of the written impairment notice to the owner be submitted to the AHJ?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.521(a)","correct":"C","difficulty":"Moderate","explanation":"Notification of the removal or revision must be postmarked, emailed, faxed, or hand-delivered within five business days. This tells the AHJ the unsafe condition has been corrected.","id":"TFM01-FOCUSED-041","options":[{"key":"A","text":"Within 24 hours"},{"key":"B","text":"Within 3 calendar days"},{"key":"C","text":"Within 5 business days"},{"key":"D","text":"Within 30 days"}],"question":"After impairments are corrected and a red tag is removed or revised, when must the AHJ be notified?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.521(d)","correct":"C","difficulty":"Difficult","explanation":"Removal is limited to an authorized employee of a registered firm who corrected and certified the work, an SFMO employee, or an authorized employee of another regulatory agency. The owner cannot simply remove it.","id":"TFM01-FOCUSED-042","options":[{"key":"A","text":"Any building employee"},{"key":"B","text":"Only the owner"},{"key":"C","text":"An authorized employee of the correcting registered firm, SFMO employee, or authorized government regulator"},{"key":"D","text":"Any licensed electrician"}],"question":"Who may remove a red tag after the impairment is corrected?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.521(a)","correct":"C","difficulty":"Easy","explanation":"No service tag may be attached until the impairment is corrected or the equipment is replaced and then re-inspected in good operating condition. A service tag would otherwise falsely certify acceptable work.","id":"TFM01-FOCUSED-043","options":[{"key":"A","text":"Yes, if the red tag stays too"},{"key":"B","text":"Yes, with owner approval"},{"key":"C","text":"No"},{"key":"D","text":"Only for 24 hours"}],"question":"May a normal service tag be attached while the equipment remains unsafe or inoperable?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.521(b)","correct":"B","difficulty":"Moderate","explanation":"The rule states that red tags must be the same size as service tags. The different color and warning language communicate the impaired condition.","id":"TFM01-FOCUSED-044","options":[{"key":"A","text":"It must be twice as large"},{"key":"B","text":"It must be the same size"},{"key":"C","text":"It may be any size"},{"key":"D","text":"It must be smaller"}],"question":"How does the required size of a red tag compare with a service tag?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.521(a)","correct":"B","difficulty":"Moderate","explanation":"The signature certifies that the listed impairments indicate unsafe or inoperable equipment. It does not certify successful service; that occurs only after correction and reinspection.","id":"TFM01-FOCUSED-045","options":[{"key":"A","text":"That the owner approved the repair estimate"},{"key":"B","text":"That the listed impairments make the equipment unsafe or inoperable"},{"key":"C","text":"That the equipment passed inspection"},{"key":"D","text":"That the AHJ waived correction"}],"question":"What does the licensee's signature on a red tag certify?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.517(a)(2)","correct":"B","difficulty":"Easy","explanation":"A service tag certifying the completed work must be securely attached to the portable extinguisher. The tag documents and certifies what the licensee performed.","id":"TFM01-FOCUSED-046","options":[{"key":"A","text":"A purchase receipt"},{"key":"B","text":"A service tag certifying the work"},{"key":"C","text":"A red tag in every case"},{"key":"D","text":"The manufacturer's warranty"}],"question":"After completing service on a portable extinguisher, what must the licensee attach?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.517(a)(4)","correct":"C","difficulty":"Moderate","explanation":"The back of the tag must be plainly marked “No Listing Mark.” The exception does not erase other required markings or permit every unlisted extinguisher to be serviced.","id":"TFM01-FOCUSED-047","options":[{"key":"A","text":"Special Service"},{"key":"B","text":"Owner Approved"},{"key":"C","text":"No Listing Mark"},{"key":"D","text":"DOT Waiver"}],"question":"What wording must appear on the back of the service tag when an eligible extinguisher without an approved listing mark is serviced under the exception?","topic":"Tags & Notices"},{"cat":3,"citation":"28 TAC §34.521(c)(1)","correct":"B","difficulty":"Difficult","explanation":"The required warning is “DO NOT REMOVE—EQUIPMENT IMPAIRED” in capital letters and at least 10-point boldface type. It plainly distinguishes an impairment tag from a completed-service tag.","id":"TFM01-FOCUSED-048","options":[{"key":"A","text":"SERVICE COMPLETE"},{"key":"B","text":"DO NOT REMOVE—EQUIPMENT IMPAIRED"},{"key":"C","text":"OWNER RESPONSIBLE"},{"key":"D","text":"INSPECTION PENDING"}],"question":"Which statement must appear prominently on a red tag?","topic":"Tags & Notices"},{"cat":4,"citation":"28 TAC §34.517(a)(3)","correct":"B","difficulty":"Easy","explanation":"The owner must request the service in writing, and the extinguisher must fall within one of the three specified categories. Written permission alone does not make every unlisted extinguisher eligible.","id":"TFM01-FOCUSED-049","options":[{"key":"A","text":"Verbal permission"},{"key":"B","text":"A written request"},{"key":"C","text":"A purchase receipt"},{"key":"D","text":"An insurance claim number"}],"question":"Before an eligible portable extinguisher without an approved listing mark may be serviced under the special exception, what must the owner provide?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(a)(3)","correct":"B","difficulty":"Moderate","explanation":"The exception includes portable CO2 extinguishers serviced under U.S. DOT requirements. It also covers specified Coast Guard vessel extinguishers and certain owner-used cartridge-actuated extinguishers.","id":"TFM01-FOCUSED-050","options":[{"key":"A","text":"Any obsolete extinguisher sold at auction"},{"key":"B","text":"A CO2 extinguisher serviced under U.S. DOT requirements"},{"key":"C","text":"Any extinguisher owned by a restaurant"},{"key":"D","text":"Any cylinder with missing instructions"}],"question":"Which extinguisher is one of the types eligible for the written-request, no-listing-mark service exception?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(b)(2)-(3)","correct":"B","difficulty":"Easy","explanation":"The licensee whose signature is on the installation label must personally be present for the final test. The signature and presence connect certification to the person accepting responsibility for the installation.","id":"TFM01-FOCUSED-051","options":[{"key":"A","text":"The building owner"},{"key":"B","text":"The licensee whose signature appears on the installation label"},{"key":"C","text":"Any apprentice"},{"key":"D","text":"A fire-department employee in every case"}],"question":"Who must be present for the final test before a newly installed fixed system is certified?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(b)(3)","correct":"C","difficulty":"Moderate","explanation":"A Type A or Type PL licensee must place the label and certify compliance. Planning still must come from a Type PL licensee or professional engineer.","id":"TFM01-FOCUSED-052","options":[{"key":"A","text":"A Type B licensee"},{"key":"B","text":"Any apprentice"},{"key":"C","text":"A Type A or Type PL licensee"},{"key":"D","text":"Only the property owner"}],"question":"Who places the installation label on a completed non-pre-engineered fixed extinguisher system?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.519","correct":"B","difficulty":"Moderate","explanation":"The installation label is affixed to the system's control head or panel, where it becomes a durable installation record. It is not merely filed in the contractor's office.","id":"TFM01-FOCUSED-053","options":[{"key":"A","text":"On the building's front door"},{"key":"B","text":"On the control head or panel"},{"key":"C","text":"On the service vehicle"},{"key":"D","text":"Inside the owner's insurance file only"}],"question":"Where is the installation label for a fixed extinguisher system attached?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(d)","correct":"B","difficulty":"Difficult","explanation":"All three conditions matter: correct size/type for the hazards, functional parts and equipment, and compliance with adopted standards. Age alone or an owner waiver does not establish suitability.","id":"TFM01-FOCUSED-054","options":[{"key":"A","text":"The owner signs a waiver"},{"key":"B","text":"It is the proper size and type, all parts function as designed, and it meets applicable adopted standards"},{"key":"C","text":"It is less than five years old"},{"key":"D","text":"The same technician performs both installations"}],"question":"A previously installed pre-engineered system may be moved and reinstalled only if which conditions are satisfied?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(e)","correct":"C","difficulty":"Moderate","explanation":"Non-pre-engineered systems must be planned by a Type PL licensee or professional engineer. A Type A licensee may install, service, or supervise but does not receive the planning authority.","id":"TFM01-FOCUSED-055","options":[{"key":"A","text":"A Type B licensee"},{"key":"B","text":"A Type K licensee"},{"key":"C","text":"A Type PL licensee or professional engineer"},{"key":"D","text":"Any registered-firm employee"}],"question":"Who may plan a fixed extinguisher system other than a pre-engineered system?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(e)","correct":"B","difficulty":"Difficult","explanation":"The rule permits an employee of the registered firm to install under direct supervision of a Type A or PL licensee without obtaining a separate license or permit. That narrow provision does not authorize unsupervised work.","id":"TFM01-FOCUSED-056","options":[{"key":"A","text":"Never"},{"key":"B","text":"Yes, under direct supervision of a Type A or Type PL licensee"},{"key":"C","text":"Yes, without supervision"},{"key":"D","text":"Only with the owner's written request"}],"question":"May an unlicensed employee of a registered firm help install a non-pre-engineered fixed system?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(f)","correct":"A","difficulty":"Moderate","explanation":"Commercial-cooking systems in the covered category must meet UL 300. Existing systems subject to the rule that do not comply must be red-tagged after the applicable deadline.","id":"TFM01-FOCUSED-057","options":[{"key":"A","text":"UL 300"},{"key":"B","text":"UL 1254 only"},{"key":"C","text":"NFPA 13D"},{"key":"D","text":"No listed standard"}],"question":"What standard must commercial-cooking pre-engineered systems installed or modified after July 1, 1996 meet?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(h)","correct":"B","difficulty":"Difficult","explanation":"The manufacturer's date stamp must be within one year of the replacement date. The service tag must also record the new links' year of manufacture, temperature, and quantity.","id":"TFM01-FOCUSED-058","options":[{"key":"A","text":"It must be manufactured in the same calendar month"},{"key":"B","text":"Its manufacturer date must be within one year of replacement"},{"key":"C","text":"It may have no date if unused"},{"key":"D","text":"It must be at least five years old"}],"question":"What date requirement applies to a replacement fusible-metal-alloy sensing element in a kitchen hood system?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(i)","correct":"A","difficulty":"Moderate","explanation":"The replacement cartridge must bear the date of replacement. This is different from the fusible link, which uses the manufacturer's date stamp and has additional service-tag details.","id":"TFM01-FOCUSED-059","options":[{"key":"A","text":"The date of replacement"},{"key":"B","text":"Only the technician's initials"},{"key":"C","text":"The restaurant's permit number"},{"key":"D","text":"The next inspection date only"}],"question":"What must be placed on a disposable actuation cartridge replaced during kitchen-system service?","topic":"Systems & Service"},{"cat":4,"citation":"28 TAC §34.517(j)","correct":"B","difficulty":"Difficult","explanation":"The flag of the new tamper seal must show the year it was attached, and the date must be imprinted or embossed. A marker is expressly prohibited.","id":"TFM01-FOCUSED-060","options":[{"key":"A","text":"The full date written in marker"},{"key":"B","text":"The attachment year imprinted or embossed on the flag"},{"key":"C","text":"No date is required"},{"key":"D","text":"The month punched on the cylinder"}],"question":"After a portable extinguisher's pull pin or locking device is operated during maintenance, how must the new tamper seal be dated?","topic":"Systems & Service"},{"cat":5,"citation":"TDI Fire Extinguisher Registration, License, and Test Information","correct":"C","difficulty":"Easy","explanation":"TDI states that the test contains 50 true/false or multiple-choice questions. PSI may use different forms, so the exact combination can vary.","id":"TFM01-FOCUSED-061","options":[{"key":"A","text":"25"},{"key":"B","text":"40"},{"key":"C","text":"50"},{"key":"D","text":"100"}],"question":"How many questions are on the TFM01 examination?","topic":"Test & Law"},{"cat":5,"citation":"28 TAC §34.516(a); TDI test information","correct":"B","difficulty":"Easy","explanation":"A score of at least 70 percent is required. On a 50-question test, that means at least 35 correct answers.","id":"TFM01-FOCUSED-062","options":[{"key":"A","text":"60%"},{"key":"B","text":"70%"},{"key":"C","text":"75%"},{"key":"D","text":"80%"}],"question":"What score is required to pass TFM01?","topic":"Test & Law"},{"cat":5,"citation":"TDI TFM01 test references","correct":"B","difficulty":"Moderate","explanation":"TDI identifies Chapter 6001 and the fire-extinguisher rules in 28 TAC Chapter 34 as the TFM01 references. NFPA 10 is primarily associated with the separate TFM02 technical test.","id":"TFM01-FOCUSED-063","options":[{"key":"A","text":"NFPA 10 only"},{"key":"B","text":"Texas Insurance Code Chapter 6001 and 28 TAC Chapter 34, Subchapter E"},{"key":"C","text":"Manufacturer manuals only"},{"key":"D","text":"Local city ordinances only"}],"question":"Which materials are the official basis for every TFM01 question?","topic":"Test & Law"},{"cat":5,"citation":"TDI test description","correct":"D","difficulty":"Easy","explanation":"TDI describes these tests as closed book. Gabe therefore needs to recognize duties, license scopes, deadlines, and tag rules without looking them up during the test.","id":"TFM01-FOCUSED-064","options":[{"key":"A","text":"Yes"},{"key":"B","text":"Only the statutes are allowed"},{"key":"C","text":"Only electronic copies are allowed"},{"key":"D","text":"No"}],"question":"Is TFM01 open book?","topic":"Test & Law"},{"cat":5,"citation":"TDI test restrictions; 28 TAC §34.516(f)","correct":"B","difficulty":"Moderate","explanation":"The current restriction is once per week and no more than three attempts for that test type during a 12-month period. The three-attempt limit is why focused preparation matters.","id":"TFM01-FOCUSED-065","options":[{"key":"A","text":"Daily with no limit"},{"key":"B","text":"Once a week and no more than three times in 12 months"},{"key":"C","text":"Once a month and four times yearly"},{"key":"D","text":"Twice in a lifetime"}],"question":"How frequently may an applicant schedule the same type of test?","topic":"Test & Law"},{"cat":5,"citation":"Texas Insurance Code §6001.002(5-a)","correct":"A","difficulty":"Easy","explanation":"The statute defines it as a monthly inspection. It checks location, tampering or actuation, and obvious damage or conditions that could prevent operation; it is not the same as servicing.","id":"TFM01-FOCUSED-066","options":[{"key":"A","text":"A monthly check"},{"key":"B","text":"A six-year teardown"},{"key":"C","text":"A hydrostatic test"},{"key":"D","text":"A sales demonstration"}],"question":"What is a portable fire extinguisher inspection under Chapter 6001?","topic":"Test & Law"},{"cat":5,"citation":"Texas Insurance Code §6001.002(5-a)","correct":"B","difficulty":"Moderate","explanation":"The defined inspection covers designated location, actuation or tampering, and obvious physical damage or another condition that may prevent proper operation. It is a visual readiness check, not complete maintenance.","id":"TFM01-FOCUSED-067","options":[{"key":"A","text":"Price, color, and warranty"},{"key":"B","text":"Location, evidence of actuation or tampering, and obvious physical damage or operating problems"},{"key":"C","text":"Only cylinder pressure"},{"key":"D","text":"Only the service company's identity"}],"question":"Which group correctly states what the monthly portable-extinguisher inspection checks?","topic":"Test & Law"},{"cat":5,"citation":"Texas Insurance Code §6001.002(7)","correct":"B","difficulty":"Moderate","explanation":"The definition includes hands-on maintenance and testing activities. The statute separately defines the monthly inspection, so do not treat an inspection as full servicing.","id":"TFM01-FOCUSED-068","options":[{"key":"A","text":"Advertising extinguishers"},{"key":"B","text":"Charging, filling, maintaining, recharging, refilling, repairing, or testing equipment"},{"key":"C","text":"Monthly visual inspection only"},{"key":"D","text":"Writing an insurance policy"}],"question":"Which activity is included in the statutory meaning of service or servicing?","topic":"Test & Law"},{"cat":5,"citation":"Texas Insurance Code §6001.156(a)(3)","correct":"A","difficulty":"Moderate","explanation":"Chapter 6001 contains a narrow exemption when an owner, managing agent, or employee installs portable extinguishers in the owner's building. It does not authorize a public service business or unrelated fixed-system work.","id":"TFM01-FOCUSED-069","options":[{"key":"A","text":"The licensing provisions may be exempt for that limited installation"},{"key":"B","text":"The employee may service customer equipment for a fee"},{"key":"C","text":"The employee may install any fixed suppression system"},{"key":"D","text":"The exemption automatically creates a registered firm"}],"question":"A building owner has an employee install portable extinguishers in the owner's own building. Which statement is correct?","topic":"Test & Law"},{"cat":5,"citation":"Texas Insurance Code §6001.159","correct":"C","difficulty":"Moderate","explanation":"Renewed registrations and licenses are valid for two years. An apprentice permit follows its own one-year period and should not be confused with a regular license renewal.","id":"TFM01-FOCUSED-070","options":[{"key":"A","text":"Six months"},{"key":"B","text":"One year"},{"key":"C","text":"Two years"},{"key":"D","text":"Five years"}],"question":"How long is a renewal of a registration certificate or license valid?","topic":"Test & Law"},{"cat":5,"citation":"28 TAC §34.516(g)","correct":"C","difficulty":"Difficult","explanation":"The applicant has one year after passing to complete and submit the licensing requirements, except for NICET testing. Missing that deadline voids the test result and requires another passing test.","id":"TFM01-FOCUSED-071","options":[{"key":"A","text":"30 days"},{"key":"B","text":"Six months"},{"key":"C","text":"One year"},{"key":"D","text":"Two years"}],"question":"An applicant passes a required license test. How long does the applicant have to complete and submit all application requirements before the test is voided?","topic":"Test & Law"},{"cat":5,"citation":"28 TAC §34.516(d)","correct":"B","difficulty":"Difficult","explanation":"After two years or more, the person must apply for a new license and pass the required test again. A license renewed within two years of expiration does not require retesting under this rule.","id":"TFM01-FOCUSED-072","options":[{"key":"A","text":"Pay only a late fee"},{"key":"B","text":"Take and pass the required test again"},{"key":"C","text":"Ask the former employer to reactivate it"},{"key":"D","text":"No action if the person still has the old card"}],"question":"A former licensee's license has been expired for two years or longer. What is required to obtain a new license?","topic":"Test & Law"}];
const CATS=["Money & Deadlines","License Types","Firm Rules","Tags & Notices","Systems & Service","Test & Law"];
const $=x=>document.getElementById(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),cash=n=>(n<0?"−":"")+"$"+Math.abs(n).toLocaleString();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let players=[],turn=0,round=1,board=[],used=new Set,missed=[],current,stake,locked=false,sound=false,ac,finalQ,fi,wagers=[],results=[];
function beep(ok){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=ok?660:160;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3)}catch{}}
$("sound").onclick=()=>{sound=!sound;$("sound").textContent="Sound "+(sound?"on":"off");beep(true)};
$("new").onclick=()=>{if(!players.length||confirm("End this game?"))setup()};
function scores(){return '<div class="scores">'+players.map((p,i)=>'<div class="score '+(i===turn?'active':'')+'">'+esc(p.name)+'<strong>'+cash(p.score)+'</strong></div>').join('')+'</div>'}
function setup(){players=[];$("app").innerHTML='<section class="panel"><div class="small">GABE’S TFM01 • 164 STUDY QUESTIONS • REVISION 2</div><h2>Your study night. Game show rules.</h2><p>Choose your clues, uncover Daily Doubles, and wager your points in the final challenge.</p><label for="names">1–3 player names, separated by commas</label><input id="names" value="Gabe"><div class="actions"><button class="gold" id="start">LET’S PLAY →</button></div><details><summary>How to play and AirPlay to the TV</summary><p>Correct answers add points. Wrong answers subtract points. Family players take turns choosing and answering. There are two 30-clue boards drawn from a focused 72-question bank, then a final wager. Missed questions appear in the end-of-game review.</p><p>Open this page on your iPhone. On the same Wi-Fi as your AirPlay-compatible TV, open Control Center → Screen Mirroring → select the TV. Turn your phone sideways for the wide board. Everyone sees the same screen and answer choices.</p><p>Higher values favor harder questions where available. This is independent exam practice, not an official test or certification.</p></details></section>';$("start").onclick=()=>{players=$("names").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,3).map(name=>({name,score:0}));if(!players.length)players=[{name:"Gabe",score:0}];round=1;turn=0;used=new Set;missed=[];makeBoard();render()}}
function makeBoard(){board=[];for(let c=0;c<6;c++){let pool=shuffle(BANK.filter(q=>q.cat===c&&!used.has(q.id)));pool.sort((a,b)=>({Easy:0,Moderate:1,Difficult:2}[a.difficulty]??1)-({Easy:0,Moderate:1,Difficult:2}[b.difficulty]??1));for(let row=0;row<5;row++){let q=shuffle(pool.slice(Math.floor(row*pool.length/5),Math.floor((row+1)*pool.length/5)))[0];used.add(q.id);board.push({q,row,c,value:200*round*(row+1),done:false,dd:false})}}shuffle(board.filter(t=>t.row>0)).slice(0,round).forEach(t=>t.dd=true)}
function render(){$("app").innerHTML=scores()+'<p>'+esc(players[turn].name)+', choose a clue. <span class="small">Round '+round+' · '+board.filter(t=>t.done).length+'/30</span></p><div class="board">'+CATS.map(c=>'<div class="cat">'+c+'</div>').join('')+Array.from({length:5},(_,r)=>board.filter(t=>t.row===r).map(t=>'<button class="tile" data-t="'+board.indexOf(t)+'" '+(t.done?'disabled':'')+' aria-label="'+CATS[t.c]+' '+cash(t.value)+'">'+(t.done?'·':cash(t.value))+'</button>').join('')).join('')+'</div>';$("app").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{current=board[Number(b.dataset.t)];stake=current.value;locked=false;if(current.dd){beep(true);wager("DAILY DOUBLE",Math.max(players[turn].score,round*1000),n=>{stake=n;clue()})}else clue()})}
function wager(title,max,next){$("app").innerHTML=scores()+'<section class="panel"><h2>'+title+'</h2><p>'+esc(players[turn].name)+' · '+CATS[(title==="DAILY DOUBLE"?current.q:finalQ).cat]+'</p><label for="bet">Your wager: $0–'+max+'</label><input id="bet" type="number" min="0" max="'+max+'" step="1" value="0"><p id="error" role="alert"></p><div class="actions"><button class="gold" id="lock">Lock wager →</button></div></section>';$("lock").onclick=()=>{let n=Number($("bet").value);if(!Number.isInteger(n)||n<0||n>max){$("error").textContent="Enter a whole number within the limit.";return}next(n)}}
function clue(){let q=current.q;$("app").innerHTML=scores()+'<section class="panel"><div class="small">'+CATS[q.cat]+' · '+cash(stake)+'</div><h2>'+esc(q.question)+'</h2><div class="answers">'+shuffle(q.options).map(o=>'<button data-a="'+o.key+'">'+esc(o.text)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></section>';$("app").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(locked)return;locked=true;let ok=b.dataset.a===q.correct;players[turn].score+=ok?stake:-stake;current.done=true;if(!ok)missed.push(q);beep(ok);$("app").querySelectorAll("[data-a]").forEach(x=>{x.disabled=true;if(x.dataset.a===q.correct)x.classList.add("good");else if(x===b)x.classList.add("bad")});$("feedback").innerHTML='<div class="feedback"><b>'+(ok?'Correct! +':'Not this time. −')+cash(stake)+'</b><p>'+esc(q.explanation)+'</p><div class="small">'+esc(q.id)+' · '+esc(q.citation)+'</div></div><div class="actions"><button class="gold" id="next">Continue →</button></div>';$("next").onclick=()=>{turn=(turn+1)%players.length;if(board.every(t=>t.done)){if(round===1){round=2;makeBoard();render()}else startFinal()}else render()}})}
function startFinal(){finalQ=shuffle(BANK.filter(q=>!used.has(q.id)))[0];fi=0;wagers=[];results=[];finalBet()}
function finalBet(){turn=fi;wager("FINAL CHALLENGE",Math.max(0,players[turn].score),n=>{wagers.push(n);fi++;if(fi<players.length)finalBet();else{fi=0;finalAnswer()}})}
function finalAnswer(){turn=fi;$("app").innerHTML='<section class="panel"><div class="small">FINAL CHALLENGE · '+esc(players[turn].name)+'</div><h2>'+esc(finalQ.question)+'</h2><p class="small">Answers are revealed after everyone has submitted.</p><div class="answers">'+finalQ.options.map(o=>'<button data-f="'+o.key+'">'+esc(o.text)+'</button>').join('')+'</div></section>';$("app").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{results.push(b.dataset.f===finalQ.correct);fi++;if(fi<players.length)finalAnswer();else{players.forEach((p,i)=>p.score+=results[i]?wagers[i]:-wagers[i]);if(results.some(x=>!x))missed.push(finalQ);finish()}})}
function finish(){let top=Math.max(...players.map(p=>p.score));let winners=players.filter(p=>p.score===top).map(p=>p.name).join(" & ");beep(true);$("app").innerHTML='<section class="panel"><div class="small">BOARD COMPLETE</div><h2>'+esc(winners)+' takes the board!</h2>'+scores()+'<div class="feedback"><b>Final answer: '+esc(finalQ.options.find(o=>o.key===finalQ.correct).text)+'</b><p>'+esc(finalQ.explanation)+'</p><span class="small">'+esc(finalQ.citation)+'</span></div><p>'+players.map((p,i)=>esc(p.name)+': '+(results[i]?'+':'−')+cash(wagers[i])).join(' · ')+'</p><button class="gold" id="again">Play again</button><details open><summary>Review missed clues ('+missed.length+')</summary>'+missed.map(q=>'<p><b>'+esc(q.question)+'</b><br>'+esc(q.explanation)+'<br><span class="small">'+esc(q.citation)+'</span></p>').join('')+'</details></section>';$("again").onclick=setup()}
setup();
</script></html>
