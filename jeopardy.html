nistered by local authorities having jurisdiction rather than by the Texas Department of Insurance.","topic":"Administration"},{"cat":5,"citation":"§6001.051(b)","correct":"A","difficulty":"Moderate","explanation":"The commissioner may issue rules considered necessary to administer Chapter 6001 through the state fire marshal. (§6001.051(b)).","id":"TFM01-Q0017","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The commissioner may issue rules considered necessary to administer Chapter 6001 through the state fire marshal.","topic":"Administration"},{"cat":5,"citation":"§6001.052(a)(1)","correct":"B","difficulty":"Moderate","explanation":"False. In adopting necessary rules, the commissioner may use standards published by NFPA. (§6001.052(a)(1)).","id":"TFM01-Q0018","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"In adopting necessary rules, the commissioner must use standards published by NFPA.","topic":"Rulemaking"},{"cat":5,"citation":"§6001.052(a)(2)","correct":"A","difficulty":"Moderate","explanation":"The commissioner may use standards recognized by federal law or regulation. (§6001.052(a)(2)).","id":"TFM01-Q0019","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The commissioner may use standards recognized by federal law or regulation.","topic":"Rulemaking"},{"cat":5,"citation":"§6001.052(a)(3)","correct":"B","difficulty":"Moderate","explanation":"False. The commissioner may use standards published by a nationally recognized standards-making organization. (§6001.052(a)(3)).","id":"TFM01-Q0020","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The commissioner must use standards published by a nationally recognized standards-making organization.","topic":"Rulemaking"},{"cat":5,"citation":"§6001.052(a)(4)","correct":"A","difficulty":"Moderate","explanation":"The commissioner may use standards contained in manufacturers' installation manuals. (§6001.052(a) partment must determine that the location is part of a registered firm.","topic":"Registration"},{"cat":3,"citation":"§6001.153(a)(1)","correct":"B","difficulty":"Moderate","explanation":"False. A firm performing hydrostatic testing of DOT-specification extinguishers must comply with U.S. DOT procedures for compressed gas cylinders. (§6001.153(a)(1)).","id":"TFM01-Q0057","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"A Type C firm may ignore U.S. DOT testing procedures when testing DOT-specification cylinders.","topic":"Hydrostatic Testing"},{"cat":3,"citation":"§6001.153(a)(2)","correct":"A","difficulty":"Moderate","explanation":"A firm performing hydrostatic testing of DOT-specification extinguishers must hold a State Fire Marshal registration certificate authorizing hydrostatic testing. (§6001.153(a)(2)).","id":"TFM01-Q0058","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"A firm performing hydrostatic testing of DOT-specification extinguishers must hold a State Fire Marshal registration certificate authorizing hydrostatic testing.","topic":"Hydrostatic Testing"},{"cat":3,"citation":"§6001.153(b)","correct":"B","difficulty":"Moderate","explanation":"False. The license of an individual qualified for DOT-specification hydrostatic testing must indicate that authority. (§6001.153(b)).","id":"TFM01-Q0059","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"An individual's qualification for DOT-specification hydrostatic testing need not be indicated on the individual's license.","topic":"Hydrostatic Testing"},{"cat":3,"citation":"§6001.153(c)","correct":"A","difficulty":"Moderate","explanation":"Hydrostatic testing not performed under U.S. DOT specifications must be performed in the manner recommended by NFPA. (§6001.153(c)).","id":"TFM01-Q0060","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Hydrostatic testing not performed under U.S. DOT specifications must be performed in the manner recommended by NFPA.","topic":"Hydrostatic Testing"},{"cat":0,"citation":"§6001.154(a)","correct":"B","difficulty":"Moderate","explanation":"False. A registration certificate cannot be issued unless the applicant files evidence of general liability insurance including products and completed operations coverage. (§6001.154(a)).","id":"TFM01-Q0061","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"A registration certificate may be issued without evidence of general liability insurance.","topic":"Insurance"},{"cat":0,"citation":"§6001.154(b)(1)","correct":"D","difficulty":"Moderate","explanation":"Required liability coverage is at least $100,000 combined single limit for bodily injury and property damage per occurrence. (§6001.154(b)(1)). Exam trap: Keep statutory maximum fees in Chapter 6001 separate from the current rule fees in §34.515.","id":"TFM01-Q0063","options":[{"key":"A","text":"$50,000"},{"key":"B","text":"$200,000"},{"key":"C","text":"$300,000"},{"key":"D","text":"$100,000"}],"question":"Under the statute, what amount belongs in the blank?\n\nRequired liability coverage is at least _____ combined single limit for bodily injury and property damage per occurrence","topic":"Insurance"},{"cat":0,"citation":"§6001.154(b)(2)","correct":"A","difficulty":"Moderate","explanation":"Required aggregate liability coverage is at least $300,000 for all occurrences per policy year. (§6001.154(b)(2)). Exam trap: Keep statutory maximum fees in Chapter 6001 separate from the current rule fees in §34.515.","id":"TFM01-Q0064","options":[{"key":"A","text":"$300,000"},{"key":"B","text":"$100,000"},{"key":"C","text":"$200,000"},{"key":"D","text":"$500,000"}],"question":"Under the statute, what amount belongs in the blank?\n\nRequired aggregate liability coverage is at least _____ for all occurrences per policy year","topic":"Insurance"},{"cat":0,"citation":"§6001.154(c)","correct":"A","difficulty":"Moderate","explanation":"Evidence of insurance generally must be a certificate of insurance executed by an insurer authorized in Texas and countersigned by a Texas-licensed insurance agent. (§6001.154(c)).","id":"TFM01-Q0065","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Evidence of insurance generally must be a certificate of insurance executed by an insurer authorized in Texas and countersigned by a Texas-licensed insurance agent.","topic":"Insurance"},{"cat":0,"citation":"§6001.154(c)","correct":"B","difficulty":"Moderate","explanation":"False. Qualifying surplus-lines coverage procured in compliance with Chapter 981 may be filed as evidence of required coverage. (§6001.154(c)).","id":"TFM01-Q0066","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Surplus-lines insurance can never be accepted as evidence of the required liability coverage.","topic":"Insurance"},{"cat":0,"citation":"§6001.154(d)","correct":"A","difficulty":"Moderate","explanation":"An insurance certificate remains in force until the insurer terminates future liability by the notice required by the department. (§6001.154(d)).","id":"TFM01-Q0067","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"An insurance certificate remains in force until the insurer terminates future liability by the notice required by the department.","topic":"Insurance"},{"cat":0,"citation":"§6001.154(e)","correct":"B","difficulty":"Moderate","explanation":"False. Failure to maintain required liability insurance is grounds, after notice and opportunity for hearing, for denial, suspension, or revocation of a registration certificate. (§6001.154(e)).","id":"TFM01-Q0068","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Failure to maintain required liability insurance is not grounds, after notice and opportunity for hearing, for denial, suspension, or revocation of a registration certificate.","topic":"Insurance"},{"cat":1,"citation":"§6001.155(a)(1)","correct":"A","difficulty":"Moderate","explanation":"Except for statutory exemptions, an individual other than an apprentice must hold a department license before installing or servicing portable extinguishers. (§6001.155(a)(1)). Qualification: Subject to §6001.156 exemptions.","id":"TFM01-Q0069","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Except for statutory exemptions, an individual other than an apprentice must hold a department license before installing or servicing portable extinguishers.","topic":"Employee License"},{"cat":1,"citation":"§6001.155(a)(2)","correct":"B","difficulty":"Moderate","explanation":"False. A license is required before installing, servicing, or certifying pre-engineered fixed systems. (§6001.155(a)(2)). Qualification: Subject to §6001.156 exemptions.","id":"TFM01-Q0070","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"A portable-only license authorizes installation and certification of pre-engineered fixed systems.","topic":"Employee License"},{"cat":1,"citation":"§6001.155(a)(3)","correct":"A","difficulty":"Moderate","explanation":"A license is required before planning, supervising, servicing, or certifying installation of non-pre-engineered fixed systems. (§6001.155(a)(3)). Qualification: Subject to §6001.156 exemptions.","id":"TFM01-Q0071","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"A license is required before planning, supervising, servicing, or certifying installation of non-pre-engineered fixed systems.","topic":"Employee License"},{"cat":1,"citation":"§6001.155(b)","correct":"B","difficulty":"Moderate","explanation":"False. A person licensed to install/service portables or fixed systems must be an employee or agent of a registered firm. (§6001.155(b)). Exam trap: The statute says a licensee must be an employee or agent of a registered firm; the TAC restriction says a licensee must be employed by a registered firm.","id":"TFM01-Q0072","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"An individual license alone permits the holder to work independently of any registered firm.","topic":"Employee License"},{"cat":1,"citation":"§6001.158(a)","correct":"B","difficulty":"Moderate","explanation":"Notice of examination results must be sent not later than the 30th day after the exam is administered. (§6001.158(a)).","id":"TFM01-Q0089","options":[{"key":"A","text":"Within 14 days"},{"key":"B","text":"Within 30 days"},{"key":"C","text":"Within 60 days"},{"key":"D","text":"Within 90 days"}],"question":"When SFMO administers an exam without a testing service, how soon must it send notice of the results?","topic":"Examination Results"},{"cat":1,"citation":"§6001.158(b)","correct":"C","difficulty":"Moderate","explanation":"If a testing service conducts, grades, or reviews the exam, notice must be sent not later than the 14th day after the State Fire Marshal receives the results. (§6001.158(b)).","id":"TFM01-Q0090","options":[{"key":"A","text":"Within 30 days"},{"key":"B","text":"Within 60 days"},{"key":"C","text":"Within 14 days"},{"key":"D","text":"Within 90 days"}],"question":"If a testing service conducts, grades, or reviews the exam, how soon after SFMO receives the results must notice be sent?","topic":"Examination Results"},{"cat":1,"citation":"§6001.158(c)","correct":"D","difficulty":"Moderate","explanation":"If results will be delayed more than 90 days after the exam date, the State Fire Marshal must notify the examinee of the reason before the 90th day. (§6001.158(c)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0091","options":[{"key":"A","text":"Day 30"},{"key":"B","text":"Day 60"},{"key":"C","text":"Day 180"},{"key":"D","text":"Day 90"}],"question":"Before which day after the exam must SFMO explain a delay in results that will exceed the statutory limit?","topic":"Examination Results"},{"cat":1,"citation":"§6001.158(d)","correct":"A","difficulty":"Moderate","explanation":"The State Fire Marshal may require the testing service to notify examinees of results. (§6001.158(d)).","id":"TFM01-Q0092","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The State Fire Marshal may require the testing service to notify examinees of results.","topic":"Examination Results"},{"cat":1,"citation":"§6001.158(e)","correct":"B","difficulty":"Moderate","explanation":"False. A person who fails a licensing exam may request in writing an analysis of exam performance, which the State Fire Marshal must provide. (§6001.158(e)).","id":"TFM01-Q0093","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"SFMO may refuse to provide an examination-performance analysis after a failed applicant requests it in writing.","topic":"Examination Results"},{"cat":1,"citation":"§6001.161(a)","correct":"A","difficulty":"Moderate","explanation":"An apprentice may not install or service portable extinguishers or fixed systems without a department-issued apprentice permit. (§6001.161(a)).","id":"TFM01-Q0097","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"An apprentice may not install or service portable extinguishers or fixed systems without a department-issued apprentice permit.","topic":"Apprentice"},{"cat":1,"citation":"§6001.161(b)","correct":"B","difficulty":"Moderate","explanation":"False. An apprentice may perform regulated service only under direct supervision of a licensed individual who works for the same firm. (§6001.161(b)).","id":"TFM01-Q0098","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"An apprentice may perform regulated work alone if a supervisor is available by telephone.","topic":"Apprentice"},{"cat":2,"citation":"§6001.162","correct":"A","difficulty":"Moderate","explanation":"Registration certificates, licenses, and permits issued under Chapter 6001 are not transferable. (§6001.162). Exam trap: Certificates, licenses, and permits are all nontransferable, but the credential and reporting rules for changes differ.","id":"TFM01-Q0099","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Registration certificates, licenses, and permits issued under Chapter 6001 are not transferable.","topic":"Transferability"},{"cat":2,"citation":"§6001.201(a)","correct":"A","difficulty":"Moderate","explanation":"A renewed registration certificate or license is valid for two years. (§6001.201(a)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0100","options":[{"key":"A","text":"2 years"},{"key":"B","text":"1 year"},{"key":"C","text":"3 years"},{"key":"D","text":"5 years"}],"question":"How long is a renewed registration certificate or license valid?","topic":"Renewal"},{"cat":2,"citation":"§6001.201(a)","correct":"B","difficulty":"Moderate","explanation":"On renewal, the license or registration fee for each year of the two-year period is payable. (§6001.201(a)).","id":"TFM01-Q0101","options":[{"key":"A","text":"1 year"},{"key":"B","text":"2 years"},{"key":"C","text":"3 years"},{"key":"D","text":"5 years"}],"question":"How many years of fees are payable when renewing a registration certificate or license?","topic":"Renewal"},{"cat":2,"citation":"§6001.201(b)","correct":"C","difficulty":"Moderate","explanation":"An apprentice permit expires on the first anniversary of issuance. (§6001.201(b)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0102","options":[{"key":"A","text":"After 6 months"},{"key":"B","text":"After 2 years"},{"key":"C","text":"After 1 year"},{"key":"D","text":"After 3 years"}],"question":"When does an apprentice permit expire after issuance?","topic":"Renewal"},{"cat":2,"citation":"§6001.201(c)","correct":"B","difficulty":"Moderate","explanation":"False. The commissioner may establish staggered expiration dates during the year. (§6001.201(c)).","id":"TFM01-Q0103","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The commissioner must establish staggered expiration dates during the year.","topic":"Renewal"},{"cat":2,"citation":"§6001.201(c)","correct":"A","difficulty":"Moderate","explanation":"If an initial/staggered expiration period is less than one year, the fee is prorated monthly; subsequent renewals require the full renewal fee. (§6001.201(c)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0104","options":[{"key":"A","text":"Prorated monthly"},{"key":"B","text":"Prorated daily"},{"key":"C","text":"Charged at the full annual amount"},{"key":"D","text":"Waived entirely"}],"question":"How is the initial fee adjusted when a staggered expiration period is less than one year?","topic":"Renewal"},{"cat":2,"citation":"§6001.202","correct":"B","difficulty":"Moderate","explanation":"The State Fire Marshal must send written notice of impending expiration at least 30 days before a registration certificate or license expires, to the holder's last known address. (§6001.202). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0105","options":[{"key":"A","text":"At least 14 days"},{"key":"B","text":"At least 30 days"},{"key":"C","text":"At least 60 days"},{"key":"D","text":"At least 90 days"}],"question":"How far ahead of expiration must SFMO send the statutory written expiration notice?","topic":"Renewal"},{"cat":2,"citation":"§6001.203(a)","correct":"C","difficulty":"Moderate","explanation":"An unexpired registration certificate or license may be renewed by paying the required renewal fee before expiration. (§6001.203(a)).","id":"TFM01-Q0106","options":[{"key":"A","text":"Within 14 days after expiration"},{"key":"B","text":"Within 30 days after expiration"},{"key":"C","text":"Before expiration"},{"key":"D","text":"Within 90 days after expiration"}],"question":"When must the renewal fee for an unexpired credential be paid to renew it without becoming late?","topic":"Renewal"},{"cat":2,"citation":"§6001.203(b)","correct":"D","difficulty":"Moderate","explanation":"If expired 90 days or less, renewal requires the normal renewal fee plus a fee equal to one-half of the initial fee. (§6001.203(b)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0107","options":[{"key":"A","text":"Renewal fee only"},{"key":"B","text":"Renewal fee plus the full initial fee"},{"key":"C","text":"Twice the renewal fee"},{"key":"D","text":"Renewal fee plus half the initial fee"}],"question":"Under the statute, what must be paid to renew a credential expired for 90 days or less?","topic":"Renewal"},{"cat":2,"citation":"§6001.203(c)","correct":"A","difficulty":"Moderate","explanation":"If expired more than 90 days but less than two years, renewal requires all unpaid renewal fees plus a fee equal to the initial fee. (§6001.203(c)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0108","options":[{"key":"A","text":"All unpaid renewal fees plus the initial fee"},{"key":"B","text":"Current renewal fee only"},{"key":"C","text":"All unpaid renewal fees plus half the initial fee"},{"key":"D","text":"Initial fee only"}],"question":"Under the statute, what must be paid to renew a credential expired more than 90 days but less than two years?","topic":"Renewal"},{"cat":2,"citation":"§6001.203(d)","correct":"B","difficulty":"Moderate","explanation":"If expired two years or longer, the certificate or license cannot be renewed; a new initial application is required. (§6001.203(d)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0109","options":[{"key":"A","text":"1 year"},{"key":"B","text":"2 years"},{"key":"C","text":"3 years"},{"key":"D","text":"5 years"}],"question":"At what length of expiration is a new initial application required instead of renewal?","topic":"Renewal"},{"cat":2,"citation":"§6001.203(e)","correct":"A","difficulty":"Moderate","explanation":"The renewal procedure does not prevent the department from denying or refusing renewal under applicable law or rules. (§6001.203(e)).","id":"TFM01-Q0110","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The renewal procedure does not prevent the department from denying or refusing renewal under applicable law or rules.","topic":"Renewal"},{"cat":5,"citation":"§6001.251(a)(1)","correct":"B","difficulty":"Moderate","explanation":"False. It is prohibited to engage in installing or servicing portable extinguishers without a registration certificate. (§6001.251(a)(1)).","id":"TFM01-Q0111","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"A firm may install portable extinguishers for customers without a registration certificate.","topic":"Prohibited Practices"},{"cat":5,"citation":"§6001.254(a)","correct":"A","difficulty":"Moderate","explanation":"After refusal or revocation (other than failure to pass the written exam), a new application may not be filed before the first anniversary of the effective date. (§6001.254(a)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0128","options":[{"key":"A","text":"1 year"},{"key":"B","text":"30 days"},{"key":"C","text":"90 days"},{"key":"D","text":"2 years"}],"question":"After refusal or revocation for a reason other than failing the written exam, how long must a person wait before filing a new application?","topic":"Reapplication"},{"cat":5,"citation":"§6001.254(b)","correct":"B","difficulty":"Moderate","explanation":"After the first anniversary, the person may reapply and must show good cause in a public hearing why issuance is not against public safety and welfare. (§6001.254(b)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0129","options":[{"key":"A","text":"In a private meeting with the employer"},{"key":"B","text":"At a public hearing"},{"key":"C","text":"On a notarized customer statement"},{"key":"D","text":"In a letter to the testing service"}],"question":"When reapplying after the required waiting period following revocation, where must the person show good cause for issuance?","topic":"Reapplication"},{"cat":5,"citation":"§6001.301(b)","correct":"A","difficulty":"Moderate","explanation":"The offense for knowingly violating §6001.251(a) is a Class B misdemeanor. (§6001.301(b)).","id":"TFM01-Q0132","options":[{"key":"A","text":"Class B misdemeanor"},{"key":"B","text":"Class A misdemeanor"},{"key":"C","text":"Class C misdemeanor"},{"key":"D","text":"State jail felony"}],"question":"What is the classification of knowingly violating Insurance Code §6001.251(a)?","topic":"Criminal Penalty"},{"cat":4,"citation":"§34.506(2)","correct":"A","difficulty":"Easy","explanation":"Business means planning, certifying, installing, leasing, renting, selling, or servicing portable extinguishers or fixed systems. (§34.506(2)).","id":"TFM01-Q0144","options":[{"key":"A","text":"Business"},{"key":"B","text":"Inspection"},{"key":"C","text":"Installation"},{"key":"D","text":"Certification"}],"question":"Which term is defined as the following?\n\nplanning, certifying, installing, leasing, renting, selling, or servicing portable extinguishers or fixed systems","topic":"Definitions"},{"cat":4,"citation":"§34.506(3)","correct":"B","difficulty":"Easy","explanation":"Certificate means the certificate of registration issued by the State Fire Marshal. (§34.506(3)).","id":"TFM01-Q0145","options":[{"key":"A","text":"License"},{"key":"B","text":"Certificate"},{"key":"C","text":"Apprentice permit"},{"key":"D","text":"Service tag"}],"question":"Which term is defined as the following?\n\nthe certificate of registration issued by the State Fire Marshal","topic":"Definitions"},{"cat":4,"citation":"§34.506(4)","correct":"C","difficulty":"Easy","explanation":"Certify means attesting to proper planning, installation, or servicing by attaching a completed service tag or other governmental form. (§34.506(4)).","id":"TFM01-Q0146","options":[{"key":"A","text":"Inspect"},{"key":"B","text":"Plan"},{"key":"C","text":"Certify"},{"key":"D","text":"Test"}],"question":"Which term is defined as the following?\n\nattesting to proper planning, installation, or servicing by attaching a completed service tag or other governmental form","topic":"Definitions"},{"cat":4,"citation":"§34.506(5)","correct":"D","difficulty":"Easy","explanation":"Commissioner means the Commissioner of Insurance. (§34.506(5)).","id":"TFM01-Q0147","options":[{"key":"A","text":"State fire marshal"},{"key":"B","text":"Local fire marshal"},{"key":"C","text":"Testing-service director"},{"key":"D","text":"Commissioner of Insurance"}],"question":"Who is the 'commissioner' referred to in the extinguisher rules?","topic":"Definitions"},{"cat":4,"citation":"§34.506(6)","correct":"A","difficulty":"Easy","explanation":"Department means the Texas Department of Insurance. (§34.506(6)).","id":"TFM01-Q0148","options":[{"key":"A","text":"Texas Department of Insurance"},{"key":"B","text":"Local authority having jurisdiction"},{"key":"C","text":"Testing laboratory"},{"key":"D","text":"Standards organization"}],"question":"Which agency is meant by 'department' in the extinguisher rules?","topic":"Definitions"},{"cat":4,"citation":"§34.506(9)","correct":"D","difficulty":"Easy","explanation":"Installation means initial placement of a portable/fixed system or an extension or alteration after initial placement. (§34.506(9)).","id":"TFM01-Q0151","options":[{"key":"A","text":"Inspection"},{"key":"B","text":"Maintenance"},{"key":"C","text":"Hydrostatic testing"},{"key":"D","text":"Installation"}],"question":"Which term is defined as the following?\n\ninitial placement of a portable/fixed system or an extension or alteration after initial placement","topic":"Definitions"},{"cat":4,"citation":"§34.506(10)","correct":"A","difficulty":"Moderate","explanation":"License means a license issued by the State Fire Marshal to an employee of a registered firm. (§34.506(10)). Exam trap: Employee, agent, and apprentice status have different source requirements.","id":"TFM01-Q0152","options":[{"key":"A","text":"License"},{"key":"B","text":"Certificate of registration"},{"key":"C","text":"Service tag"},{"key":"D","text":"Installation label"}],"question":"Which term is defined as the following?\n\na license issued by the State Fire Marshal to an employee of a registered firm","topic":"Definitions"},{"cat":4,"citation":"§34.506(11)","correct":"B","difficulty":"Easy","explanation":"NFPA means National Fire Protection Association, Inc., a nationally recognized standards-making organization. (§34.506(11)).","id":"TFM01-Q0153","options":[{"key":"A","text":"NICET"},{"key":"B","text":"NFPA"},{"key":"C","text":"DOT"},{"key":"D","text":"TDI"}],"question":"Which term is defined as the following?\n\nNational Fire Protection Association, Inc., a nationally recognized standards-making organization","topic":"Definitions"},{"cat":4,"citation":"§34.506(12)","correct":"C","difficulty":"Easy","explanation":"NICET means National Institute for the Certification in Engineering Technologies. (§34.506(12)).","id":"TFM01-Q0154","options":[{"key":"A","text":"NFPA"},{"key":"B","text":"DOT"},{"key":"C","text":"NICET"},{"key":"D","text":"TDI"}],"question":"Which term is defined as the following?\n\nNational Institute for the Certification in Engineering Technologies","topic":"Definitions"},{"cat":4,"citation":"§34.506(13)","correct":"D","difficulty":"Easy","explanation":"Outsource testing service means the service selected by the State Fire Marshal to administer designated qualifying license tests. (§34.506(13)).","id":"TFM01-Q0155","options":[{"key":"A","text":"Approved testing laboratory"},{"key":"B","text":"Registered firm"},{"key":"C","text":"Local authority having jurisdiction"},{"key":"D","text":"Outsource testing service"}],"question":"Which term is defined as the following?\n\nthe service selected by the State Fire Marshal to administer designated qualifying license tests","topic":"Definitions"},{"cat":4,"citation":"§34.506(14)","correct":"A","difficulty":"Easy","explanation":"Person means a natural person. (§34.506(14)).","id":"TFM01-Q0156","options":[{"key":"A","text":"Person"},{"key":"B","text":"Firm"},{"key":"C","text":"Department"},{"key":"D","text":"Association"}],"question":"Which term is defined as the following?\n\na natural person","topic":"Definitions"},{"cat":4,"citation":"§34.506(15)","correct":"B","difficulty":"Easy","explanation":"Plan means to lay out, detail, draw, calculate, devise, or arrange an assembly of detection or suppression devices and appurtenances in accordance with adopted fire-protection standards or specifications specially designed by a Texas registered professional engineer acting solely in the engineer's professional capacity. (§34.506(15)).","id":"TFM01-Q0157","options":[{"key":"A","text":"Certify"},{"key":"B","text":"Plan"},{"key":"C","text":"Service"},{"key":"D","text":"Inspect"}],"question":"Which term is defined as the following?\n\nto lay out, detail, draw, calculate, devise, or arrange an assembly of detection or suppression devices and appurtenances in accordance with adopted fire-protection standards or specifications specially designed by a Texas registered professional engineer acting solely in the engineer's professional capacity","topic":"Definitions"},{"cat":4,"citation":"§34.506(16)","correct":"C","difficulty":"Easy","explanation":"Registered firm means a person, partnership, corporation, or association holding a current certificate of registration. (§34.506(16)).","id":"TFM01-Q0158","options":[{"key":"A","text":"Licensee"},{"key":"B","text":"Apprentice"},{"key":"C","text":"Registered firm"},{"key":"D","text":"Insurance agent"}],"question":"Which term is defined as the following?\n\na person, partnership, corporation, or association holding a current certificate of registration","topic":"Definitions"},{"cat":4,"citation":"§34.506(17)","correct":"D","difficulty":"Easy","explanation":"Shop means a fixed or mobile registered-firm facility where servicing, repair, or hydrostatic testing is performed and required parts/equipment are maintained. (§34.506(17)).","id":"TFM01-Q0159","options":[{"key":"A","text":"Branch certificate"},{"key":"B","text":"Testing standard"},{"key":"C","text":"Installation site"},{"key":"D","text":"Shop"}],"question":"Which term is defined as the following?\n\na fixed or mobile registered-firm facility where servicing, repair, or hydrostatic testing is performed and required parts/equipment are maintained","topic":"Definitions"},{"cat":4,"citation":"§34.506(18)","correct":"A","difficulty":"Easy","explanation":"Test means subjecting a portable or fixed system to a procedure necessary to determine proper installation or correct operation. (§34.506(18)).","id":"TFM01-Q0160","options":[{"key":"A","text":"Test"},{"key":"B","text":"Certify"},{"key":"C","text":"Plan"},{"key":"D","text":"Lease"}],"question":"Which term is defined as the following?\n\nsubjecting a portable or fixed system to a procedure necessary to determine proper installation or correct operation","topic":"Definitions"},{"cat":4,"citation":"§34.506(19)","correct":"B","difficulty":"Moderate","explanation":"Direct supervision means oversight by a licensee of services performed by another licensee or permittee. (§34.506(19)). Exam trap: Direct-supervision location rules differ at the shop, away from the shop, and for engineered fixed systems.","id":"TFM01-Q0161","options":[{"key":"A","text":"Certification"},{"key":"B","text":"Direct supervision"},{"key":"C","text":"Inspection"},{"key":"D","text":"Plan review"}],"question":"Which term is defined as the following?\n\noversight by a licensee of services performed by another licensee or permittee","topic":"Definitions"},{"cat":2,"citation":"§34.510(b)","correct":"D","difficulty":"Moderate","explanation":"Before engaging in business, each registered firm must have at least one licensed person properly equipped to perform the acts authorized by the certificate. (§34.510(b)).","id":"TFM01-Q0183","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4"},{"key":"D","text":"1"}],"question":"Before engaging in business, what is the minimum number of properly equipped licensed people a registered firm must have?","topic":"Registration / Shop"},{"cat":2,"citation":"§34.510(c)","correct":"B","difficulty":"Moderate","explanation":"A separate Type C registration is required for hydrostatic testing of U.S. DOT specification extinguisher cylinders. (§34.510(c)). Exam trap: Type C is a firm registration for U.S. DOT specification cylinder hydrostatic testing, not the Type B individual license.","id":"TFM01-Q0185","options":[{"key":"A","text":"Type B"},{"key":"B","text":"Type C"},{"key":"C","text":"Type K"},{"key":"D","text":"Type PL"}],"question":"Which registration authorizes hydrostatic testing of U.S. DOT-specification extinguisher cylinders?","topic":"Registration / Shop"},{"cat":2,"citation":"§34.510(d)","correct":"D","difficulty":"Moderate","explanation":"The registered business location must be a physical address, not merely a mailing address or P.O. box. (§34.510(d)).","id":"TFM01-Q0187","options":[{"key":"A","text":"A post office box alone"},{"key":"B","text":"Any mailing address alone"},{"key":"C","text":"The owner's email address alone"},{"key":"D","text":"A physical address"}],"question":"What kind of address must a registered business location have?","topic":"Registration / Shop"},{"cat":2,"citation":"§34.510(f)","correct":"A","difficulty":"Moderate","explanation":"Vehicle lettering/numbers must be at least one inch high and permanently affixed or magnetically attached to each side in contrasting color. (§34.510(f)).","id":"TFM01-Q0224","options":[{"key":"A","text":"1 inch"},{"key":"B","text":"1/2 inch"},{"key":"C","text":"2 inches"},{"key":"D","text":"3 inches"}],"question":"What is the minimum height of the required vehicle lettering and numbers?","topic":"Registration / Changes"},{"cat":2,"citation":"§34.510(f)","correct":"B","difficulty":"Moderate","explanation":"Vehicle certificate number must use the format 'TX ECR-number.' (§34.510(f)).","id":"TFM01-Q0225","options":[{"key":"A","text":"TX FEL-"},{"key":"B","text":"TX ECR-"},{"key":"C","text":"TX EPL-"},{"key":"D","text":"TX DOT-"}],"question":"Which prefix must identify a firm's certificate number on its business vehicle?","topic":"Registration / Changes"},{"cat":2,"citation":"§34.510(g)","correct":"D","difficulty":"Moderate","explanation":"Initial branch-office certificate fee is $100 and is not prorated. (§34.510(g)). Exam trap: Keep statutory maximum fees in Chapter 6001 separate from the current rule fees in §34.515.","id":"TFM01-Q0227","options":[{"key":"A","text":"$50"},{"key":"B","text":"$70"},{"key":"C","text":"$125"},{"key":"D","text":"$100"}],"question":"Under the fee rule, what amount belongs in the blank?\n\nInitial branch-office certificate fee is _____ and is not prorated","topic":"Registration / Changes"},{"cat":2,"citation":"§34.510(h)(1)","correct":"C","difficulty":"Moderate","explanation":"New owners must submit an application for a new certificate 14 days before a total ownership change to ensure business continuity. (§34.510(h)(1)). Exam trap: The statute says 'change of ownership' while the TAC separately distinguishes total and partial ownership changes.","id":"TFM01-Q0230","options":[{"key":"A","text":"7"},{"key":"B","text":"30"},{"key":"C","text":"14"},{"key":"D","text":"60"}],"question":"What number belongs in the blank?\n\nNew owners must submit an application for a new certificate _____ days before a total ownership change to ensure business continuity","topic":"Registration / Changes"},{"cat":2,"citation":"§34.510(i)","correct":"A","difficulty":"Moderate","explanation":"A change of corporate officers must be reported in writing to the State Fire Marshal within 14 days. (§34.510(i)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0232","options":[{"key":"A","text":"14"},{"key":"B","text":"7"},{"key":"C","text":"30"},{"key":"D","text":"60"}],"question":"What number belongs in the blank?\n\nA change of corporate officers must be reported in writing to the State Fire Marshal within _____ days","topic":"Registration / Changes"},{"cat":2,"citation":"§34.510(j)","correct":"C","difficulty":"Moderate","explanation":"A lost/destroyed certificate must be replaced with a duplicate from the State Fire Marshal after written notice without delay and payment of the required fee. (§34.510(j)).","id":"TFM01-Q0234","options":[{"key":"A","text":"At the next renewal"},{"key":"B","text":"Within 30 days"},{"key":"C","text":"Without delay"},{"key":"D","text":"Within 90 days"}],"question":"When must a lost or destroyed firm certificate be reported in writing to SFMO?","topic":"Registration / Changes"},{"cat":2,"citation":"§34.510(k)","correct":"A","difficulty":"Moderate","explanation":"Written notice of a change requiring a revised certificate must be submitted within 14 days with the required fee. (§34.510(k)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0236","options":[{"key":"A","text":"14"},{"key":"B","text":"7"},{"key":"C","text":"30"},{"key":"D","text":"60"}],"question":"What number belongs in the blank?\n\nWritten notice of a change requiring a revised certificate must be submitted within _____ days with the required fee","topic":"Registration / Changes"},{"cat":1,"citation":"§34.511(d)","correct":"D","difficulty":"Moderate","explanation":"The holder/firm must report a license change requiring revision within 14 days and pay the required fee. (§34.511(d)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0247","options":[{"key":"A","text":"7"},{"key":"B","text":"30"},{"key":"C","text":"60"},{"key":"D","text":"14"}],"question":"What number belongs in the blank?\n\nThe holder/firm must report a license change requiring revision within _____ days and pay the required fee","topic":"Licenses"},{"cat":1,"citation":"§34.511(e)(3)","correct":"C","difficulty":"Moderate","explanation":"A registered firm must notify the State Fire Marshal within 14 days after terminating a licensee's employment. (§34.511(e)(3)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0250","options":[{"key":"A","text":"7"},{"key":"B","text":"30"},{"key":"C","text":"14"},{"key":"D","text":"60"}],"question":"What number belongs in the blank?\n\nA registered firm must notify the State Fire Marshal within _____ days after terminating a licensee's employment","topic":"Licenses"},{"cat":1,"citation":"§34.512(b)","correct":"B","difficulty":"Moderate","explanation":"A lost/destroyed apprentice permit requires a duplicate; permit holder and employer must notify in writing without delay and pay the required fee. (§34.512(b)).","id":"TFM01-Q0253","options":[{"key":"A","text":"At the next renewal"},{"key":"B","text":"Without delay"},{"key":"C","text":"Within 30 days"},{"key":"D","text":"Within 90 days"}],"question":"When must the permit holder and employer report a lost or destroyed apprentice permit in writing?","topic":"Apprentice Permit"},{"cat":1,"citation":"§34.512(c)","correct":"D","difficulty":"Moderate","explanation":"The permit holder or registered firm must notify SFMO within 14 days of a change requiring permit revision and pay the required fee. (§34.512(c)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0255","options":[{"key":"A","text":"7"},{"key":"B","text":"30"},{"key":"C","text":"60"},{"key":"D","text":"14"}],"question":"What number belongs in the blank?\n\nThe permit holder or registered firm must notify SFMO within _____ days of a change requiring permit revision and pay the required fee","topic":"Apprentice Permit"},{"cat":2,"citation":"§34.514(d)","correct":"B","difficulty":"Moderate","explanation":"A renewal application and fee must be postmarked on or before expiration to be timely. (§34.514(d)). Exam trap: Do not confuse the 30-day deficiency-cure period with the 180-day initial-application completion period or the one-year post-test application deadline.","id":"TFM01-Q0285","options":[{"key":"A","text":"Within 14 days after expiration"},{"key":"B","text":"On or before expiration"},{"key":"C","text":"Within 30 days after expiration"},{"key":"D","text":"Within 90 days after expiration"}],"question":"For a renewal application and fee to be timely, when must they be postmarked?","topic":"Applications / Renewal"},{"cat":2,"citation":"§34.514(d)","correct":"C","difficulty":"Moderate","explanation":"If a timely renewal is incomplete but required insurance has not lapsed, the applicant has 30 days from SFMO deficiency notice to provide missing requirements. (§34.514(d)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0286","options":[{"key":"A","text":"7"},{"key":"B","text":"14"},{"key":"C","text":"30"},{"key":"D","text":"60"}],"question":"What number belongs in the blank?\n\nIf a timely renewal is incomplete but required insurance has not lapsed, the applicant has _____ days from SFMO deficiency notice to provide missing requirements","topic":"Applications / Renewal"},{"cat":2,"citation":"§34.514(d)","correct":"D","difficulty":"Moderate","explanation":"Failure to correct renewal deficiencies within the 30-day period may result in a late fee. (§34.514(d)). Exam trap: Do not confuse the 30-day deficiency-cure period with the 180-day initial-application completion period or the one-year post-test application deadline.","id":"TFM01-Q0287","options":[{"key":"A","text":"7"},{"key":"B","text":"14"},{"key":"C","text":"60"},{"key":"D","text":"30"}],"question":"What number belongs in the blank?\n\nFailure to correct renewal deficiencies within the _____-day period may result in a late fee","topic":"Applications / Renewal"},{"cat":2,"citation":"§34.514(g)","correct":"B","difficulty":"Moderate","explanation":"An initial license/registration application must be complete within 180 days of SFMO receipt, or a new application and applicable fees are required. (§34.514(g)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0293","options":[{"key":"A","text":"30"},{"key":"B","text":"180"},{"key":"C","text":"60"},{"key":"D","text":"90"}],"question":"What number belongs in the blank?\n\nAn initial license/registration application must be complete within _____ days of SFMO receipt, or a new application and applicable fees are required","topic":"Applications / Renewal"},{"cat":0,"citation":"§34.515(b)(1)(A)","correct":"D","difficulty":"Moderate","explanation":"Initial firm certificate fee is $450. (§34.515(b)(1)(A)). Exam trap: Keep statutory maximum fees in Chapter 6001 separate from the current rule fees in §34.515.","id":"TFM01-Q0295","options":[{"key":"A","text":"$250"},{"key":"B","text":"$300"},{"key":"C","text":"$600"},{"key":"D","text":"$450"}],"question":"Under the fee rule, what amount belongs in the blank?\n\nInitial firm certificate fee is _____","topic":"Fees"},{"cat":0,"citation":"§34.515(b)(1)(B)","correct":"A","difficulty":"Moderate","explanation":"Two-year firm certificate renewal fee is $600. (§34.515(b)(1)(B)). Exam trap: Keep statutory maximum fees in Chapter 6001 separate from the current rule fees in §34.515.","id":"TFM01-Q0296","options":[{"key":"A","text":"$600"},{"key":"B","text":"$300"},{"key":"C","text":"$450"},{"key":"D","text":"$900"}],"question":"What is the firm certificate renewal fee for a two-year period?","topic":"Fees"},{"cat":0,"citation":"§34.515(b)(1)(C)","correct":"B","difficulty":"Moderate","explanation":"Firm renewal late fee for 1-90 days expired is $225 plus $50 per branch office. (§34.515(b)(1)(C)). Exam trap: Keep statutory maximum fees in Chapter 6001 separate from the current rule fees in §34.515.","id":"TFM01-Q0297","options":[{"key":"A","text":"$450 plus $100 per branch"},{"key":"B","text":"$225 plus $50 per branch"},{"key":"C","text":"$100 plus $25 per branch"},{"key":"D","text":"$300 plus $75 per branch"}],"question":"What is the additional firm late fee for renewal 1–90 days after expiration?","topic":"Fees"},{"cat":0,"citation":"§34.515(b)(1)(D)","correct":"C","di const CATS=["Money & Fees","License to Work","Firm Business","On the Job","Know Your Code","Texas Rules"];
const $=x=>document.getElementById(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),cash=n=>(n<0?"−":"")+"$"+Math.abs(n).toLocaleString();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let players=[],turn=0,round=1,board=[],used=new Set,missed=[],current,stake,locked=false,sound=false,ac,finalQ,fi,wagers=[],results=[];
function beep(ok){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=ok?660:160;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3)}catch{}}
$("sound").onclick=()=>{sound=!sound;$("sound").textContent="Sound "+(sound?"on":"off");beep(true)};
$("new").onclick=()=>{if(!players.length||confirm("End this game?"))setup()};
function scores(){return '<div class="scores">'+players.map((p,i)=>'<div class="score '+(i===turn?'active':'')+'">'+esc(p.name)+'<strong>'+cash(p.score)+'</strong></div>').join('')+'</div>'}
function setup(){players=[];$("app").innerHTML='<section class="panel"><div class="small">GABE’S TFM01 • 164 STUDY QUESTIONS • REVISION 2</div><h2>Your study night. Game show rules.</h2><p>Choose your clues, uncover Daily Doubles, and wager your points in the final challenge.</p><label for="names">1–3 player names, separated by commas</label><input id="names" value="Gabe"><div class="actions"><button class="gold" id="start">LET’S PLAY →</button></div><details><summary>How to play and AirPlay to the TV</summary><p>Correct answers add points. Wrong answers subtract points. Family players take turns choosing and answering. There are two 30-clue boards, then a final wager. Missed questions appear in the end-of-game review.</p><p>Open this page on your iPhone. On the same Wi-Fi as your AirPlay-compatible TV, open Control Center → Screen Mirroring → select the TV. Turn your phone sideways for the wide board. Everyone sees the same screen and answer choices.</p><p>Higher values favor harder questions where available. This is independent exam practice, not an official test or certification.</p></details></section>';$("start").onclick=()=>{players=$("names").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,3).map(name=>({name,score:0}));if(!players.length)players=[{name:"Gabe",score:0}];round=1;turn=0;used=new Set;missed=[];makeBoard();render()}}
function makeBoard(){board=[];for(let c=0;c<6;c++){let pool=shuffle(BANK.filter(q=>q.cat===c&&!used.has(q.id)));pool.sort((a,b)=>({Easy:0,Moderate:1,Difficult:2}[a.difficulty]??1)-({Easy:0,Moderate:1,Difficult:2}[b.difficulty]??1));for(let row=0;row<5;row++){let q=shuffle(pool.slice(Math.floor(row*pool.length/5),Math.floor((row+1)*pool.length/5)))[0];used.add(q.id);board.push({q,row,c,value:200*round*(row+1),done:false,dd:false})}}shuffle(board.filter(t=>t.row>0)).slice(0,round).forEach(t=>t.dd=true)}
function render(){$("app").innerHTML=scores()+'<p>'+esc(players[turn].name)+', choose a clue. <span class="small">Round '+round+' · '+board.filter(t=>t.done).length+'/30</span></p><div class="board">'+CATS.map(c=>'<div class="cat">'+c+'</div>').join('')+Array.from({length:5},(_,r)=>board.filter(t=>t.row===r).map(t=>'<button class="tile" data-t="'+board.indexOf(t)+'" '+(t.done?'disabled':'')+' aria-label="'+CATS[t.c]+' '+cash(t.value)+'">'+(t.done?'·':cash(t.value))+'</button>').join('')).join('')+'</div>';$("app").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{current=board[Number(b.dataset.t)];stake=current.value;locked=false;if(current.dd){beep(true);wager("DAILY DOUBLE",Math.max(players[turn].score,round*1000),n=>{stake=n;clue()})}else clue()})}
function wager(title,max,next){$("app").innerHTML=scores()+'<section class="panel"><h2>'+title+'</h2><p>'+esc(players[turn].name)+' · '+CATS[(title==="DAILY DOUBLE"?current.q:finalQ).cat]+'</p><label for="bet">Your wager: $0–'+max+'</label><input id="bet" type="number" min="0" max="'+max+'" step="1" value="0"><p id="error" role="alert"></p><div class="actions"><button class="gold" id="lock">Lock wager →</button></div></section>';$("lock").onclick=()=>{let n=Number($("bet").value);if(!Number.isInteger(n)||n<0||n>max){$("error").textContent="Enter a whole number within the limit.";return}next(n)}}
function clue(){let q=current.q;$("app").innerHTML=scores()+'<section class="panel"><div class="small">'+CATS[q.cat]+' · '+cash(stake)+'</div><h2>'+esc(q.question)+'</h2><div class="answers">'+shuffle(q.options).map(o=>'<button data-a="'+o.key+'">'+esc(o.text)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></section>';$("app").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(locked)return;locked=true;let ok=b.dataset.a===q.correct;players[turn].score+=ok?stake:-stake;current.done=true;if(!ok)missed.push(q);beep(ok);$("app").querySelectorAll("[data-a]").forEach(x=>{x.disabled=true;if(x.dataset.a===q.correct)x.classList.add("good");else if(x===b)x.classList.add("bad")});$("feedback").innerHTML='<div class="feedback"><b>'+(ok?'Correct! +':'Not this time. −')+cash(stake)+'</b><p>'+esc(q.explanation)+'</p><div class="small">'+esc(q.id)+' · '+esc(q.citation)+'</div></div><div class="actions"><button class="gold" id="next">Continue →</button></div>';$("next").onclick=()=>{turn=(turn+1)%players.length;if(board.every(t=>t.done)){if(round===1){round=2;makeBoard();render()}else startFinal()}else render()}})}
function startFinal(){finalQ=shuffle(BANK.filter(q=>!used.has(q.id)))[0];fi=0;wagers=[];results=[];finalBet()}
function finalBet(){turn=fi;wager("FINAL CHALLENGE",Math.max(0,players[turn].score),n=>{wagers.push(n);fi++;if(fi<players.length)finalBet();else{fi=0;finalAnswer()}})}
function finalAnswer(){turn=fi;$("app").innerHTML='<section class="panel"><div class="small">FINAL CHALLENGE · '+esc(players[turn].name)+'</div><h2>'+esc(finalQ.question)+'</h2><p class="small">Answers are revealed after everyone has submitted.</p><div class="answers">'+finalQ.options.map(o=>'<button data-f="'+o.key+'">'+esc(o.text)+'</button>').join('')+'</div></section>';$("app").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{results.push(b.dataset.f===finalQ.correct);fi++;if(fi<players.length)finalAnswer();else{players.forEach((p,i)=>p.score+=results[i]?wagers[i]:-wagers[i]);if(results.some(x=>!x))missed.push(finalQ);finish()}})}
function finish(){let top=Math.max(...players.map(p=>p.score));let winners=players.filter(p=>p.score===top).map(p=>p.name).join(" & ");beep(true);$("app").innerHTML='<section class="panel"><div class="small">BOARD COMPLETE</div><h2>'+esc(winners)+' takes the board!</h2>'+scores()+'<div class="feedback"><b>Final answer: '+esc(finalQ.options.find(o=>o.key===finalQ.correct).text)+'</b><p>'+esc(finalQ.explanation)+'</p><span class="small">'+esc(finalQ.citation)+'</span></div><p>'+players.map((p,i)=>esc(p.name)+': '+(results[i]?'+':'−')+cash(wagers[i])).join(' · ')+'</p><button class="gold" id="again">Play again</button><details open><summary>Review missed clues ('+missed.length+')</summary>'+missed.map(q=>'<p><b>'+esc(q.question)+'</b><br>'+esc(q.explanation)+'<br><span class="small">'+esc(q.citation)+'</span></p>').join('')+'</details></section>';$("again").onclick=setup()}
setup();
</script></html>
