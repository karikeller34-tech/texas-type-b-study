al, partnership, corporation, or association.","topic":"Definitions","cat":4},{"citation":"§6001.002(2)","correct":"A","difficulty":"Easy","explanation":"Fixed fire extinguisher system means an assembly of piping, conduits, or containers that conveys liquid, powder, or gases to dispersal openings/devices protecting one or more hazards by suppressing or extinguishing fires. (§6001.002(2)).","id":"TFM01-Q0006","options":[{"key":"A","text":"Fixed fire extinguisher system"},{"key":"B","text":"Firm"},{"key":"C","text":"Hydrostatic testing"},{"key":"D","text":"Insurance agent"}],"question":"Which term is defined as the following?\n\nan assembly of piping, conduits, or containers that conveys liquid, powder, or gases to dispersal openings/devices protecting one or more hazards by suppressing or extinguishing fires","topic":"Definitions","cat":4},{"citation":"§6001.002(3)","correct":"B","difficulty":"Easy","explanation":"False. Hydrostatic testing means pressure testing by hydrostatic methods. (§6001.002(3)).","id":"TFM01-Q0007","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Hydrostatic testing means testing that does not use pressure.","topic":"Definitions","cat":4},{"citation":"§6001.002(4)","correct":"B","difficulty":"Easy","explanation":"Insurance agent means (A) an individual, firm, or corporation licensed under Subchapter E, Chapter 981, or Subchapter A, B, C, D, E, or G, Chapter 4051; or (B) an individual authorized to represent an insurance fund or pool created by a municipality, county, or other political subdivision under Government Code Chapter 791. (§6001.002(4)).","id":"TFM01-Q0008","options":[{"key":"A","text":"Firm"},{"key":"B","text":"Insurance agent"},{"key":"C","text":"Fixed fire extinguisher system"},{"key":"D","text":"Hydrostatic testing"}],"question":"Which term is defined as the following?\n\n(A) an individual, firm, or corporation licensed under Subchapter E, Chapter 981, or Subchapter A, B, C, D, E, or G, Chapter 4051; o ":"True"},{"key":"B","text":"False"}],"question":"A portable fire extinguisher inspection does not include checking whether the extinguisher has been actuated or subjected to tampering.","topic":"Definitions","cat":4},{"citation":"§6001.002(5-a)(C)","correct":"A","difficulty":"Moderate","explanation":"A portable extinguisher inspection checks for obvious physical damage or another condition that may prevent proper operation. (§6001.002(5-a)(C)). Exam trap: Inspection is a defined monthly check and is distinct from 'service/servicing.'","id":"TFM01-Q0013","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"A portable extinguisher inspection checks for obvious physical damage or another condition that may prevent proper operation.","topic":"Definitions","cat":4},{"citation":"§6001.002(6)","correct":"B","difficulty":"Easy","explanation":"False. Registered firm means a firm that holds a registration certificate. (§6001.002(6)).","id":"TFM01-Q0014","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The general public means a firm that holds a registration certificate.","topic":"Definitions","cat":4},{"citation":"§6001.002(7)","correct":"A","difficulty":"Easy","explanation":"Service/servicing includes charging, filling, maintaining, recharging, refilling, repairing, or testing a portable extinguisher or fixed system. (§6001.002(7)).","id":"TFM01-Q0015","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Service/servicing includes charging, filling, maintaining, recharging, refilling, repairing, or testing a portable extinguisher or fixed system.","topic":"Definitions","cat":4},{"citation":"§6001.051(a)","correct":"B","difficulty":"Moderate","explanation":"False. The Texas Department of Insurance administers Chapter 6001. (§6001.051(a)).","id":"TFM01-Q0016","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Chapter 6001 is administered by local authorities having jurisdiction rather than by the Texas Department of Insurance.","topic":"Administration","cat":5},{"citation":"§6001.051(b)","correct":"A","difficulty":"Moderate","explanation":"The commissioner may issue rules considered necessary to administer Chapter 6001 through the state fire marshal. (§6001.051(b)).","id":"TFM01-Q0017","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The commissioner may issue rules considered necessary to administer Chapter 6001 through the state fire marshal.","topic":"Administration","cat":5},{"citation":"§6001.052(a)(1)","correct":"B","difficulty":"Moderate","explanation":"False. In adopting necessary rules, the commissioner may use standards published by NFPA. (§6001.052(a)(1)).","id":"TFM01-Q0018","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"In adopting necessary rules, the commissioner must use standards published by NFPA.","topic":"Rulemaking","cat":5},{"citation":"§6001.052(a)(2)","correct":"A","difficulty":"Moderate","explanation":"The commissioner may use standards recognized by federal law or regulation. (§6001.052(a)(2)).","id":"TFM01-Q0019","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The commissioner may use standards recognized by federal law or regulation.","topic":"Rulemaking","cat":5},{"citation":"§6001.052(a)(3)","correct":"B","difficulty":"Moderate","explanation":"False. The commissioner may use standards published by a nationally recognized standards-making organization. (§6001.052(a)(3)).","id":"TFM01-Q0020","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The commissioner must use standards published by a nationally recognized standards-making organization.","topic":"Rulemaking","cat":5},{"citation":"§6001.052(a)(4)","correct":"A","difficulty":"Moderate","explanation":"The commissioner may use standards contained in manufacturers' installation manuals. (§6001.052(a)(4)).","id":"TFM01-Q0021","options":[{"key":"A escribed as an exemption or limitation under Insurance Code §6001.156?","topic":"Exemptions","cat":5},{"citation":"§6001.156(a)(7)","correct":"D","difficulty":"Moderate","explanation":"The licensing provisions do not apply to a firm that is a party to a contract under which installation of portable extinguishers or a fixed system is performed under the direct supervision of and certified by an appropriately registered firm, if that registered firm assumes full responsibility for the installation. (§6001.156(a)(7)). Exam trap: Each exemption has narrow conditions; do not treat an exemption for inspection, own equipment, sale, or installation as a general exemption.","id":"TFM01-Q0080","options":[{"key":"A","text":"The licensing provisions do not apply to a firm that is a party to a contract under which installation of portable extinguishers or a fixed system is performed under the direct supervision of and certified by an appropriately general public, if that registered firm assumes full responsibility for the installation."},{"key":"B","text":"The licensing provisions do not apply to a firm that is a party to a contract under which installation of fixed systems only or a fixed system is performed under the direct supervision of and certified by an appropriately registered firm, if that registered firm assumes full responsibility for the installation."},{"key":"C","text":"This requirement is optional under alternative procedure 3."},{"key":"D","text":"The licensing provisions do not apply to a firm that is a party to a contract under which installation of portable extinguishers or a fixed system is performed under the direct supervision of and certified by an appropriately registered firm, if that registered firm assumes full responsibility for the installation."}],"question":"Which situation is correctly described as an exemption or limitation under Insurance Code §6001.156?","topic":"Exemptions","cat":5},{"citation":"§6001.156(a)(8)","correct":"A","difficulty":"Mod uirements. (§6001.160).","id":"TFM01-Q0096","options":[{"key":"A","text":"The department must waive a Texas license requirement for an applicant holding an out-of-state license with substantially equivalent requirements."},{"key":"B","text":"The department may waive a Texas license requirement for an applicant holding an out-of-state license with substantially equivalent requirements."},{"key":"C","text":"This requirement is optional under alternative procedure 2."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly reflects the Texas extinguisher statutes and rules?","topic":"Reciprocity","cat":1},{"citation":"§6001.161(a)","correct":"A","difficulty":"Moderate","explanation":"An apprentice may not install or service portable extinguishers or fixed systems without a department-issued apprentice permit. (§6001.161(a)).","id":"TFM01-Q0097","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"An apprentice may not install or service portable extinguishers or fixed systems without a department-issued apprentice permit.","topic":"Apprentice","cat":1},{"citation":"§6001.161(b)","correct":"B","difficulty":"Moderate","explanation":"False. An apprentice may perform regulated service only under direct supervision of a licensed individual who works for the same firm. (§6001.161(b)).","id":"TFM01-Q0098","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"An apprentice must perform regulated service only under direct supervision of a licensed individual who works for the same firm.","topic":"Apprentice","cat":1},{"citation":"§6001.162","correct":"A","difficulty":"Moderate","explanation":"Registration certificates, licenses, and permits issued under Chapter 6001 are not transferable. (§6001.162). Exam trap: Certificates, licenses, and permits are all nontransferable, but the credential and reporting rules for changes differ.","id":"TFM01-Q0099","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"Registration certificates, licenses, and permits issued under Chapter 6001 are not transferable.","topic":"Transferability","cat":2},{"citation":"§6001.201(a)","correct":"C","difficulty":"Moderate","explanation":"A renewed registration certificate or license is valid for two years. (§6001.201(a)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0100","options":[{"key":"A","text":"14 days"},{"key":"B","text":"30 days"},{"key":"C","text":"2 years"},{"key":"D","text":"90 days"}],"question":"What time period correctly completes this Texas extinguisher rule?\n\nA renewed registration certificate or license is valid for [VALUE] years","topic":"Renewal","cat":2},{"citation":"§6001.201(a)","correct":"D","difficulty":"Moderate","explanation":"On renewal, the license or registration fee for each year of the two-year period is payable. (§6001.201(a)).","id":"TFM01-Q0101","options":[{"key":"A","text":"14 days"},{"key":"B","text":"30 days"},{"key":"C","text":"90 days"},{"key":"D","text":"2 years of fees"}],"question":"What time period correctly completes this Texas extinguisher rule?\n\nOn renewal, the license or registration fee for each year of the [VALUE]-year period is payable","topic":"Renewal","cat":2},{"citation":"§6001.201(b)","correct":"A","difficulty":"Moderate","explanation":"An apprentice permit expires on the first anniversary of issuance. (§6001.201(b)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0102","options":[{"key":"A","text":"1 year"},{"key":"B","text":"14 days"},{"key":"C","text":"30 days"},{"key":"D","text":"90 days"}],"question":"What time period correctly completes this Texas extinguisher rule?\n\nAn apprentice permit expires on the first anniversary of issuance","topic":"Renewal","cat":2},{"citation":"§6001.201(c)","correct":"B","difficulty":"Moderate","explanation":"False. The commissioner may establish staggered expiration dates during the year. (§6001.201(c)).","id":"TFM01-Q0103","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"question":"The commissioner must establish staggered expiration dates during the year.","topic":"Renewal","cat":2},{"citation":"§6001.201(c)","correct":"B","difficulty":"Moderate","explanation":"If an initial/staggered expiration period is less than one year, the fee is prorated monthly; subsequent renewals require the full renewal fee. (§6001.201(c)). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0104","options":[{"key":"A","text":"14 days"},{"key":"B","text":"Monthly proration"},{"key":"C","text":"30 days"},{"key":"D","text":"90 days"}],"question":"What time period correctly completes this Texas extinguisher rule?\n\nIf an initial/staggered expiration period is less than [VALUE] year, the fee is prorated monthly; subsequent renewals require the full renewal fee","topic":"Renewal","cat":2},{"citation":"§6001.202","correct":"C","difficulty":"Moderate","explanation":"The State Fire Marshal must send written notice of impending expiration at least 30 days before a registration certificate or license expires, to the holder's last known address. (§6001.202). Exam trap: Time periods in these rules are easy to confuse; compare the specific trigger and whether the period uses calendar days, business days, months, or years.","id":"TFM01-Q0105","options":[{"key":"A","text":"14 days"},{"key":"B","text":"30 days"},{"key":"C","text":"At least 30 days"},{"key":"D","text":"90 days"}],"question":"What time period correctly completes this Texas extinguisher rule?\n\nThe State Fire Marshal must send written notice of impending expiration a isher systems has been revoked may retake and pass the required written examination before a new license may be issued."},{"key":"B","text":"An individual whose license to service portable fire extinguishers or to install or service fixed fire extinguisher systems has been revoked must retake and pass the required written examination before a new license may be issued."},{"key":"C","text":"An individual whose license to service portable fire extinguishers or to install or service fixed fire extinguisher systems has been revoked must retake and pass the required written examination before a new license must be issued."},{"key":"D","text":"An individual whose license to service portable fire extinguishers or to install or service fixed fire extinguisher systems has been revoked must retake and pass the required written examination after a new license may be issued."}],"question":"Which statement correctly reflects the Texas extinguisher statutes and rules?","topic":"Revocation","cat":5},{"citation":"§6001.301(a)","correct":"C","difficulty":"Moderate","explanation":"Knowingly violating §6001.251(a) is a criminal offense. (§6001.301(a)).","id":"TFM01-Q0131","options":[{"key":"A","text":"Knowingly violating §6001.251(a) is not a criminal offense."},{"key":"B","text":"This requirement is optional under alternative procedure 2."},{"key":"C","text":"Knowingly violating §6001.251(a) is a criminal offense."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly reflects the Texas extinguisher statutes and rules?","topic":"Criminal Penalty","cat":5},{"citation":"§6001.301(b)","correct":"D","difficulty":"Moderate","explanation":"The offense for knowingly violating §6001.251(a) is a Class B misdemeanor. (§6001.301(b)).","id":"TFM01-Q0132","options":[{"key":"A","text":"14 days"},{"key":"B","text":"30 days"},{"key":"C","text":"90 days"},{"key":"D","text":"Class B misdemeanor"}],"question":"What is the penalty for kn  listed by a testing laboratory approved by the commissioner, to protect lives and property. (§34.501).","id":"TFM01-Q0135","options":[{"key":"A","text":"The subchapter prohibits extinguishers, portable extinguishers only, and equipment not listed by a testing laboratory approved by the commissioner, to protect lives and property."},{"key":"B","text":"This requirement is optional under alternative procedure 2."},{"key":"C","text":"The subchapter prohibits extinguishers, fixed systems, and equipment not listed by a testing laboratory approved by the commissioner, to protect lives and property."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly describes the purpose or scope of the Texas extinguisher statute or rule?","topic":"Purpose","cat":5},{"citation":"§34.502","correct":"D","difficulty":"Moderate","explanation":"These rules may be cited as the 'extinguisher rules.' (§34.502).","id":"TFM01-Q0136","options":[{"key":"A","text":"These rules must be cited as the 'extinguisher rules.'"},{"key":"B","text":"This requirement is optional under alternative procedure 2."},{"key":"C","text":"This requirement is optional under alternative procedure 3."},{"key":"D","text":"These rules may be cited as the 'extinguisher rules.'"}],"question":"Which statement correctly reflects the Texas extinguisher statutes and rules?","topic":"Title","cat":5},{"citation":"§34.502","correct":"A","difficulty":"Moderate","explanation":"The extinguisher rules are administered by and through the State Fire Marshal. (§34.502).","id":"TFM01-Q0137","options":[{"key":"A","text":"The extinguisher rules are administered by and through the State Fire Marshal."},{"key":"B","text":"The extinguisher rules are administered by and through the local authority having jurisdiction."},{"key":"C","text":"This requirement is optional under alternative procedure 2."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}] xt":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly reflects a defined term under the Texas extinguisher statutes or rules?","topic":"Definitions","cat":4},{"citation":"§34.506(9)","correct":"C","difficulty":"Easy","explanation":"Installation means initial placement of a portable/fixed system or an extension or alteration after initial placement. (§34.506(9)).","id":"TFM01-Q0151","options":[{"key":"A","text":"Firm"},{"key":"B","text":"Fixed fire extinguisher system"},{"key":"C","text":"Installation"},{"key":"D","text":"Hydrostatic testing"}],"question":"Which term is defined as the following?\n\ninitial placement of a portable/fixed system or an extension or alteration after initial placement","topic":"Definitions","cat":4},{"citation":"§34.506(10)","correct":"D","difficulty":"Moderate","explanation":"License means a license issued by the State Fire Marshal to an employee of a registered firm. (§34.506(10)). Exam trap: Employee, agent, and apprentice status have different source requirements.","id":"TFM01-Q0152","options":[{"key":"A","text":"Firm"},{"key":"B","text":"Fixed fire extinguisher system"},{"key":"C","text":"Hydrostatic testing"},{"key":"D","text":"License"}],"question":"Which term is defined as the following?\n\na license issued by the State Fire Marshal to an employee of a registered firm","topic":"Definitions","cat":4},{"citation":"§34.506(11)","correct":"A","difficulty":"Easy","explanation":"NFPA means National Fire Protection Association, Inc., a nationally recognized standards-making organization. (§34.506(11)).","id":"TFM01-Q0153","options":[{"key":"A","text":"NFPA"},{"key":"B","text":"Firm"},{"key":"C","text":"Fixed fire extinguisher system"},{"key":"D","text":"Hydrostatic testing"}],"question":"Which term is defined as the following?\n\nNational Fire Protection Association, Inc., a nationally recognized standards-making organization","topic":"Definitions","cat":4},{"citation":"§34.506(12)","correct":"B","difficulty":"Easy","explanation":"NICET means National Institute for the Certification in Engineering Technologies. (§34.506(12)).","id":"TFM01-Q0154","options":[{"key":"A","text":"Firm"},{"key":"B","text":"NICET"},{"key":"C","text":"Fixed fire extinguisher system"},{"key":"D","text":"Hydrostatic testing"}],"question":"Which term is defined as the following?\n\nNational Institute for the Certification in Engineering Technologies","topic":"Definitions","cat":4},{"citation":"§34.506(13)","correct":"C","difficulty":"Easy","explanation":"Outsource testing service means the service selected by the State Fire Marshal to administer designated qualifying license tests. (§34.506(13)).","id":"TFM01-Q0155","options":[{"key":"A","text":"Firm"},{"key":"B","text":"Fixed fire extinguisher system"},{"key":"C","text":"Outsource testing service"},{"key":"D","text":"Hydrostatic testing"}],"question":"Which term is defined as the following?\n\nthe service selected by the State Fire Marshal to administer designated qualifying license tests","topic":"Definitions","cat":4},{"citation":"§34.506(14)","correct":"D","difficulty":"Easy","explanation":"Person means a natural person. (§34.506(14)).","id":"TFM01-Q0156","options":[{"key":"A","text":"Firm"},{"key":"B","text":"Fixed fire extinguisher system"},{"key":"C","text":"Hydrostatic testing"},{"key":"D","text":"Person"}],"question":"Which term is defined as the following?\n\na natural person","topic":"Definitions","cat":4},{"citation":"§34.506(15)","correct":"A","difficulty":"Easy","explanation":"Plan means to lay out, detail, draw, calculate, devise, or arrange an assembly of detection or suppression devices and appurtenances in accordance with adopted fire-protection standards or specifications specially designed by a Texas registered professional engineer acting solely in the engineer's professional capacity. (§34.506(15)).","id":"TFM01-Q0157","options":[{"key":"A","text":"Plan"},{"key":"B","text":"Firm"},{"key":"C","text":"Fixed fire extinguisher system"},{"key":"D","text":"Hydrostatic testing"}],"question":"Which term is defined as the following?\n\nto lay out, detail, draw, calculate, devise, or arrange an assembly of detection or suppression devices and appurtenances in accordance with adopted fire-protection standards or specifications specially designed by a Texas registered professional engineer acting solely in the engineer's professional capacity","topic":"Definitions","cat":4},{"citation":"§34.506(16)","correct":"B","difficulty":"Easy","explanation":"Registered firm means a person, partnership, corporation, or association holding a current certificate of registration. (§34.506(16)).","id":"TFM01-Q0158","options":[{"key":"A","text":"Firm"},{"key":"B","text":"Registered firm"},{"key":"C","text":"Fixed fire extinguisher system"},{"key":"D","text":"Hydrostatic testing"}],"question":"Which term is defined as the following?\n\na person, partnership, corporation, or association holding a current certificate of registration","topic":"Definitions","cat":4},{"citation":"§34.506(17)","correct":"C","difficulty":"Easy","explanation":"Shop means a fixed or mobile registered-firm facility where servicing, repair, or hydrostatic testing is performed and required parts/equipment are maintained. (§34.506(17)).","id":"TFM01-Q0159","options":[{"key":"A","text":"Firm"},{"key":"B","text":"Fixed fire extinguisher system"},{"key":"C","text":"Shop"},{"key":"D","text":"Hydrostatic testing"}],"question":"Which term is defined as the following?\n\na fixed or mobile registered-firm facility where servicing, repair, or hydrostatic testing is performed and required parts/equipment are maintained","topic":"Definitions","cat":4},{"citation":"§34.506(18)","correct":"D","difficulty":"Easy","explanation":"Test means subjecting a portable or fixed system to a procedure necessary to determine proper installation or correct operation. (§34.506(18)).","id":"TFM01-Q0160","options":[{"key":"A","text":"Firm"},{"key":"B","text":"Fixed fire extinguisher system"},{"key":"C","text":"Hydrostatic testing"},{"key":"D","text":"Test"}],"question":"Which term is defined as the following?\n\nsubjecting a portable or fixed system to a procedure necessary to determine proper installation or correct operation","topic":"Definitions","cat":4},{"citation":"§34.506(19)","correct":"A","difficulty":"Moderate","explanation":"Direct supervision means oversight by a licensee of services performed by another licensee or permittee. (§34.506(19)). Exam trap: Direct-supervision location rules differ at the shop, away from the shop, and for engineered fixed systems.","id":"TFM01-Q0161","options":[{"key":"A","text":"Direct supervision"},{"key":"B","text":"Firm"},{"key":"C","text":"Fixed fire extinguisher system"},{"key":"D","text":"Hydrostatic testing"}],"question":"Which term is defined as the following?\n\noversight by a licensee of services performed by another licensee or permittee","topic":"Definitions","cat":4},{"citation":"§34.506(19)","correct":"B","difficulty":"Moderate","explanation":"At a shop, the supervising licensee must be present at all times on the premises where the supervised licensee/permittee performs service. (§34.506(19)). Exam trap: Direct-supervision location rules differ at the shop, away from the shop, and for engineered fixed systems.","id":"TFM01-Q0162","options":[{"key":"A","text":"At a shop, the supervising licensee may be present at all times on the premises where the supervised licensee/permittee performs service."},{"key":"B","text":"At a shop, the supervising licensee must be present at all times on the premises where the supervised licensee/permittee performs service."},{"key":"C","text":"At a shop, the supervising unlicensed individual must be present at all times on the premises where the supervised licensee/permittee performs service."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly reflects a defined term under the Texas extinguisher statutes or rules?","topic":"Definitions","cat":4},{"citation":"§34.506(19)","correct":"C","difficulty":"Moderate","explanation":"Away from the shop, a person installing or servicing portable extinguishers or pre-engineered fixed systems under direct supervision must remain within sight of the supervising licensee. (§34.506(19)). Exam trap: Direct-supervision location rules differ at the shop, away from the shop, and for engineered fixed systems.","id":"TFM01-Q0163","options":[{"key":"A","text":"Away from the shop, a person installing or servicing portable extinguishers or pre-engineered fixed systems under direct supervision may remain within sight of the supervising licensee."},{"key":"B","text":"Away from the shop, a person installing or servicing portable extinguishers or pre-engineered fixed systems without direct supervision must remain within sight of the supervising licensee."},{"key":"C","text":"Away from the shop, a person installing or servicing portable extinguishers or pre-engineered fixed systems under direct supervision must remain within sight of the supervising licensee."},{"key":"D","text":"Away from the shop, a person installing or servicing portable extinguishers or pre-engineered fixed systems under direct supervision must remain within sight of the supervising unlicensed individual."}],"question":"Which statement correctly reflects a defined term under the Texas extinguisher statutes or rules?","topic":"Definitions","cat":4},{"citation":"§34.506(19)","correct":"D","difficulty":"Moderate","explanation":"For an engineered fixed system, the supervising licensee is not required to be on-site at all times during installation. (§34.506(19)). Exam trap: Direct-supervision location rules differ at the shop, away from the shop, and for engineered fixed systems.","id":"TFM01-Q0164","options":[{"key":"A","text":"For an engineered fixed system, the supervising unlicensed individual is not required to be on-site at all times during installation."},{"key":"B","text":"This requirement is optional under alternative procedure 2."},{"key":"C","text":"This requirement is optional under alternative procedure 3."},{"key":"D","text":"For an engineered fixed system, the supervising licensee is not required to be on-site at all times during installation."}],"question":"Which statement correctly reflects a defined term under the Texas extinguisher statutes or rules?","topic":"Definitions","cat":4},{"citation":"§34.507","correct":"A","difficulty":"Moderate","explanation":"The listed standards are adopted by reference in their entirety except as noted; a cross-referenced provision in another edition applies only if it does not conflict with the adopted standard. (§34.507). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0165","options":[{"key":"A","text":"The listed standards are adopted by reference in their entirety except as noted; a cross-referenced provision in another edition applies only if it does not conflict with the adopted standard."},{"key":"B","text":"The listed standards are not adopted by reference in their entirety except as noted; a cross-referenced provision in another edition applies only if it does not conflict with the adopted standard."},{"key":"C","text":"This requirement is optional under alternative procedure 2."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly describes an adopted standard?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(1)","correct":"B","difficulty":"Moderate","explanation":"NFPA 10-2018 is adopted for portable fire extinguishers. (§34.507(1)). Exam trap: Texas adopts NFPA 10-2018 in this rule; do not substitute a newer NFPA 10 edition unless the rule is amended.","id":"TFM01-Q0166","options":[{"key":"A","text":"2016"},{"key":"B","text":"2018"},{"key":"C","text":"2017"},{"key":"D","text":"2019"}],"question":"Which edition year of NFPA 10 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(2)","correct":"C","difficulty":"Moderate","explanation":"NFPA 11-2016 is adopted for low-, medium-, and high-expansion foam and combined agent systems. (§34.507(2)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0167","options":[{"key":"A","text":"2017"},{"key":"B","text":"2018"},{"key":"C","text":"2016"},{"key":"D","text":"2019"}],"question":"Which edition year of NFPA 11 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(3)","correct":"D","difficulty":"Moderate","explanation":"NFPA 12-2018 is adopted for carbon dioxide extinguishing systems. (§34.507(3)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0168","options":[{"key":"A","text":"2016"},{"key":"B","text":"2017"},{"key":"C","text":"2019"},{"key":"D","text":"2018"}],"question":"Which edition year of NFPA 12 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(4)","correct":"A","difficulty":"Moderate","explanation":"NFPA 12A-2018 is adopted for Halon 1301 systems. (§34.507(4)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0169","options":[{"key":"A","text":"2018"},{"key":"B","text":"2016"},{"key":"C","text":"2017"},{"key":"D","text":"2019"}],"question":"Which edition year of NFPA 12A is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(5)","correct":"B","difficulty":"Moderate","explanation":"NFPA 15-2017 is adopted for water spray fixed systems. (§34.507(5)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0170","options":[{"key":"A","text":"2016"},{"key":"B","text":"2017"},{"key":"C","text":"2018"},{"key":"D","text":"2019"}],"question":"Which edition year of NFPA 15 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(6)","correct":"C","difficulty":"Moderate","explanation":"NFPA 16-2019 is adopted for foam-water sprinkler and spray systems. (§34.507(6)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0171","options":[{"key":"A","text":"2016"},{"key":"B","text":"2017"},{"key":"C","text":"2019"},{"key":"D","text":"2018"}],"question":"Which edition year of NFPA 16 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(7)","correct":"D","difficulty":"Moderate","explanation":"NFPA 17-2021 is adopted for dry chemical extinguishing systems. (§34.507(7)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0172","options":[{"key":"A","text":"2016"},{"key":"B","text":"2017"},{"key":"C","text":"2018"},{"key":"D","text":"2021"}],"question":"Which edition year of NFPA 17 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(8)","correct":"A","difficulty":"Moderate","explanation":"NFPA 17A-2021 is adopted for wet chemical extinguishing systems. (§34.507(8)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0173","options":[{"key":"A","text":"2021"},{"key":"B","text":"2016"},{"key":"C","text":"2017"},{"key":"D","text":"2018"}],"question":"Which edition year of NFPA 17A is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(9)","correct":"B","difficulty":"Moderate","explanation":"NFPA 18-2021 is adopted for wetting agents. (§34.507(9)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0174","options":[{"key":"A","text":"2016"},{"key":"B","text":"2021"},{"key":"C","text":"2017"},{"key":"D","text":"2018"}],"question":"Which edition year of NFPA 18 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(10)","correct":"C","difficulty":"Moderate","explanation":"NFPA 25-2020 is adopted for inspection, testing, and maintenance of water-based fire protection systems. (§34.507(10)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0175","options":[{"key":"A","text":"2016"},{"key":"B","text":"2017"},{"key":"C","text":"2020"},{"key":"D","text":"2018"}],"question":"Which edition year of NFPA 25 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(11)","correct":"D","difficulty":"Moderate","explanation":"NFPA 33-2018 is adopted for spray application using flammable or combustible materials. (§34.507(11)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0176","options":[{"key":"A","text":"2016"},{"key":"B","text":"2017"},{"key":"C","text":"2019"},{"key":"D","text":"2018"}],"question":"Which edition year of NFPA 33 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(12)","correct":"A","difficulty":"Moderate","explanation":"NFPA 96-2021 is adopted for ventilation control and fire protection of commercial cooking operations. (§34.507(12)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0177","options":[{"key":"A","text":"2021"},{"key":"B","text":"2016"},{"key":"C","text":"2017"},{"key":"D","text":"2018"}],"question":"Which edition year of NFPA 96 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(13)","correct":"B","difficulty":"Moderate","explanation":"NFPA 2001-2018 is adopted for clean-agent fire-extinguishing systems. (§34.507(13)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0178","options":[{"key":"A","text":"2016"},{"key":"B","text":"2018"},{"key":"C","text":"2017"},{"key":"D","text":"2019"}],"question":"Which edition year of NFPA 2001 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.507(14)","correct":"C","difficulty":"Moderate","explanation":"NFPA 2010-2020 is adopted for fixed aerosol fire-extinguishing systems. (§34.507(14)). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0179","options":[{"key":"A","text":"2016"},{"key":"B","text":"2017"},{"key":"C","text":"2020"},{"key":"D","text":"2018"}],"question":"Which edition year of NFPA 2010 is adopted by the Texas extinguisher rules?","topic":"Adopted Standards","cat":4},{"citation":"§34.508","correct":"D","difficulty":"Moderate","explanation":"The commissioner approves an organization as an approved testing laboratory for equipment and appurtenances used under §34.507 when the organization meets the approved-testing-laboratory requirements in Subchapter D. (§34.508).","id":"TFM01-Q0180","options":[{"key":"A","text":"No license, permit, registration, notice, or other condition is required for this activity."},{"key":"B","text":"This requirement applies only to the general public and not to regulated firms or individuals."},{"key":"C","text":"A registered firm may disregard this requirement whenever it uses a different internal procedure."},{"key":"D","text":"The commissioner approves an organization as an approved testing laboratory for equipment and appurtenances used under §34.507 when the organization meets the approved-testing-laboratory requirements in Subchapter D."}],"question":"Which statement correctly reflects the Texas extinguisher statutes and rules?","topic":"Testing Laboratories","cat":4},{"citation":"§34.509","correct":"A","difficulty":"Moderate","explanation":"NICET is approved as a testing standards organization for testing license applicants. (§34.509).","id":"TFM01-Q0181","options":[{"key":"A","text":"NICET is approved as a testing standards organization for testing license applicants."},{"key":"B","text":"NICET is not approved as a testing standards organization for testing license applicants."},{"key":"C","text":"This requirement is optional under alternative procedure 2."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly reflects the Texas extinguisher statutes and rules?","topic":"Certification Organization","cat":4},{"citation":"§34.510(a)","correct":"B","difficulty":"Moderate","explanation":"Each firm and each branch office engaged in the business must obtain a certificate of registration from the State Fire Marshal. (§34.510(a)).","id":"TFM01-Q0182","options":[{"key":"A","text":"Each firm and each branch office engaged in the business may obtain a certificate of registration from the State Fire Marshal."},{"key":"B","text":"Each firm and each branch office engaged in the business must obtain a certificate of registration from the State Fire Marshal."},{"key":"C","text":"Each firm and each branch office engaged in the business must obtain a certificate of registration from the local authority having jurisdiction."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly describes a registered-firm or shop requirement?","topic":"Registration / Shop","cat":2},{"citation":"§34.510(b)","correct":"C","difficulty":"Moderate","explanation":"Before engaging in business, each registered firm must have at least one licensed person properly equipped to perform the acts authorized by the certificate. (§34.510(b)).","id":"TFM01-Q0183","options":[{"key":"A","text":"14 days"},{"key":"B","text":"30 days"},{"key":"C","text":"At least 1 licensed person"},{"key":"D","text":"90 days"}],"question":"What value correctly completes this Texas extinguisher rule?\n\nBefore engaging in business, each registered firm must have at least [VALUE] licensed person properly equipped to perform the acts authorized by the certificate","topic":"Registration / Shop","cat":2},{"citation":"§34.510(c)","correct":"D","difficulty":"Moderate","explanation":"A certificate authorizes only business activities authorized under the licenses of the firm's employees. (§34.510(c)).","id":"TFM01-Q0184","options":[{"key":"A","text":"No license, permit, registration, notice, or other condition is required for this activity."},{"key":"B","text":"This requirement applies only to the general public and not to regulated firms or individuals."},{"key":"C","text":"A registered firm may disregard this requirement whenever it uses a different internal procedure."},{"key":"D","text":"A certificate authorizes only business activities authorized under the licenses of the firm's employees."}],"question":"Which statement correctly describes a registered-firm or shop requirement?","topic":"Registration / Shop","cat":2},{"citation":"§34.510(c)","correct":"A","difficulty":"Moderate","explanation":"A separate Type C registration is required for hydrostatic testing of U.S. DOT specification extinguisher cylinders. (§34.510(c)). Exam trap: Type C is a firm registration for U.S. DOT specification cylinder hydrostatic testing, not the Type B individual license.","id":"TFM01-Q0185","options":[{"key":"A","text":"Type C"},{"key":"B","text":"14 days"},{"key":"C","text":"30 days"},{"key":"D","text":"90 days"}],"question":"What value correctly completes this Texas extinguisher rule?\n\nA separate Type C registration is required for hydrostatic testing of U.S. DOT specification extinguisher cylinders","topic":"Registration / Shop","cat":2},{"citation":"§34.510(d)","correct":"B","difficulty":"Moderate","explanation":"Each registered firm must maintain a specific business location shown on its certificate. (§34.510(d)).","id":"TFM01-Q0186","options":[{"key":"A","text":"Each registered firm may maintain a specific business location shown on its certificate."},{"key":"B","text":"Each registered firm must maintain a specific business location shown on its certificate."},{"key":"C","text":"Each general public must maintain a specific business location shown on its certificate."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly describes a registered-firm or shop requirement?","topic":"Registration / Shop","cat":2},{"citation":"§34.510(d)","correct":"C","difficulty":"Moderate","explanation":"The registered business location must be a physical address, not merely a mailing address or P.O. box. (§34.510(d)).","id":"TFM01-Q0187","options":[{"key":"A","text":"14 days"},{"key":"B","text":"30 days"},{"key":"C","text":"Physical address"},{"key":"D","text":"90 days"}],"question":"What value correctly completes this Texas extinguisher rule?\n\nThe registered business location must be a physical address, not merely a mailing address or P.O. box","topic":"Registration / Shop","cat":2},{"citation":"§34.510(e)","correct":"D","difficulty":"Moderate","explanation":"A registered firm must establish and maintain a shop at a business location or in a properly designed mobile unit. (§34.510(e)).","id":"TFM01-Q0188","options":[{"key":"A","text":"A registered firm may establish and maintain a shop at a business location or in a properly designed mobile unit."},{"key":"B","text":"A general public must establish and maintain a shop at a business location or in a properly designed mobile unit."},{"key":"C","text":"This requirement is optional under alternative procedure 3."},{"key":"D","text":"A registered firm must establish and maintain a shop at a business location or in a properly designed mobile unit."}],"question":"Which statement correctly describes a registered-firm or shop requirement?","topic":"Registration / Shop","cat":2},{"citation":"§34.510(e)","correct":"A","difficulty":"Moderate","explanation":"The shop must be adequately equipped to service/test all extinguisher types or systems the firm installs/services. (§34.510(e)).","id":"TFM01-Q0189","options":[{"key":"A","text":"The shop must be adequately equipped to service/test all extinguisher types or systems the firm installs/services."},{"key":"B","text":"The shop may be adequately equipped to service/test all extinguisher types or systems the firm installs/services."},{"key":"C","text":"This requirement is optional under alternative procedure 2."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly describes a registered-firm or shop requirement?","topic":"Registration / Shop","cat":2},{"citation":"§34.510(e)(1)","correct":"B","difficulty":"Moderate","explanation":"Shop must maintain the most recently adopted edition of NFPA 10. (§34.510(e)(1)). Qualification: Conditional items apply only when the described work is performed.","id":"TFM01-Q0190","options":[{"key":"A","text":"Shop may maintain the most recently adopted edition of NFPA 10."},{"key":"B","text":"Shop must maintain the most recently adopted edition of NFPA 10."},{"key":"C","text":"This requirement is optional under alternative procedure 2."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly describes a minimum shop-equipment or shop-record requirement?","topic":"Shop Equipment","cat":2},{"citation":"§34.510(e)(2)","correct":"C","difficulty":"Moderate","explanation":"Shop must maintain the most recently adopted Insurance Code Chapter 6001 and Chapter 34. (§34.510(e)(2)). Qualification: Conditional items apply only when the described work is performed.","id":"TFM01-Q0191","options":[{"key":"A","text":"Shop may maintain the most recently adopted Insurance Code Chapter 6001 and Chapter 34."},{"key":"B","text":"This requirement is optional under alternative procedure 2."},{"key":"C","text":"Shop must maintain the most recently adopted Insurance Code Chapter 6001 and Chapter 34."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}], new on the same date as the main-office certificate."}],"question":"Which statement correctly describes a registration, ownership, vehicle, or change-reporting requirement?","topic":"Registration / Changes","cat":2},{"citation":"§34.510(h)(1)","correct":"A","difficulty":"Moderate","explanation":"A total change of firm ownership invalidates the current certificate. (§34.510(h)(1)). Exam trap: The statute says 'change of ownership' while the TAC separately distinguishes total and partial ownership changes.","id":"TFM01-Q0229","options":[{"key":"A","text":"A total change of firm ownership invalidates the current certificate."},{"key":"B","text":"No license, permit, registration, notice, or other condition is required for this activity."},{"key":"C","text":"This requirement applies only to the general public and not to regulated firms or individuals."},{"key":"D","text":"A registered firm may disregard this requirement whenever it uses a different internal procedure."}],"question":"Which statement correctly describes a registration, ownership, vehicle, or change-reporting requirement?","topic":"Registration / Changes","cat":2},{"citation":"§34.510(h)(1)","correct":"B","difficulty":"Moderate","explanation":"New owners must submit an application for a new certificate 14 days before a total ownership change to ensure business continuity. (§34.510(h)(1)). Exam trap: The statute says 'change of ownership' while the TAC separately distinguishes total and partial ownership changes.","id":"TFM01-Q0230","options":[{"key":"A","text":"14 days"},{"key":"B","text":"14 days before"},{"key":"C","text":"30 days"},{"key":"D","text":"90 days"}],"question":"What time period correctly completes this Texas extinguisher rule?\n\nNew owners must submit an application for a new certificate [VALUE] days before a total ownership change to ensure business continuity","topic":"Registration / Changes","cat":2},{"citation":"§34.510(h)(2)","correct":"C","difficulty":"Moderate","explanation":"A partia ptions":[{"key":"A","text":"No license, permit, registration, notice, or other condition is required for this activity."},{"key":"B","text":"This requirement applies only to the general public and not to regulated firms or individuals."},{"key":"C","text":"A registered firm may disregard this requirement whenever it uses a different internal procedure."},{"key":"D","text":"The exceptions in Insurance Code §6001.156 apply to Subchapter E."}],"question":"Which statement correctly resolves this common exam-trap issue?\n\nEach exemption has narrow conditions; do not treat an exemption for inspection, own equipment, sale, or installation as a general exemption.","topic":"Exceptions","cat":5},{"citation":"§34.507","correct":"A","difficulty":"Difficult","explanation":"The listed standards are adopted by reference in their entirety except as noted; a cross-referenced provision in another edition applies only if it does not conflict with the adopted standard. (§34.507). Exam trap: The standard number and adopted edition year must be kept together.","id":"TFM01-Q0469","options":[{"key":"A","text":"The listed standards are adopted by reference in their entirety except as noted; a cross-referenced provision in another edition applies only if it does not conflict with the adopted standard."},{"key":"B","text":"The listed standards are not adopted by reference in their entirety except as noted; a cross-referenced provision in another edition applies only if it does not conflict with the adopted standard."},{"key":"C","text":"This requirement is optional under alternative procedure 2."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly resolves this common exam-trap issue?\n\nThe standard number and adopted edition year must be kept together.","topic":"Adopted Standards","cat":4},{"citation":"§34.518(d)","correct":"B","difficulty":"Difficult","explanation":"A rubber stamp may supply required information, but a stamped signature is prohibited. (§34.518(d)). Qualification: Fixed-system focused. Exam trap: Rubber stamps may sometimes supply other information, but a stamped signature is expressly prohibited in the cited rule.","id":"TFM01-Q0470","options":[{"key":"A","text":"A rubber stamp must supply required information, but a stamped signature is prohibited."},{"key":"B","text":"A rubber stamp may supply required information, but a stamped signature is prohibited."},{"key":"C","text":"A rubber stamp may supply required information, but a stamped signature is permitted."},{"key":"D","text":"This requirement is optional under alternative procedure 3."}],"question":"Which statement correctly resolves this common exam-trap issue?\n\nRubber stamps may sometimes supply other information, but a stamped signature is expressly prohibited in the cited rule.","topic":"Fixed-System Plans","cat":3},{"citation":"§34.519(a)(4)","correct":"C","difficulty":"Difficult","explanation":"Installation label must include the authorized licensee's signature and license number; stamped signature is prohibited. (§34.519(a)(4)). Exam trap: Rubber stamps may sometimes supply other information, but a stamped signature is expressly prohibited in the cited rule.","id":"TFM01-Q0471","options":[{"key":"A","text":"Installation label may include the authorized licensee's signature and license number; stamped signature is prohibited."},{"key":"B","text":"Installation label must include the authorized licensee's signature and license number; a stamped signature is permitted."},{"key":"C","text":"Installation label must include the authorized licensee's signature and license number; stamped signature is prohibited."},{"key":"D","text":"Installation label must include the authorized unlicensed individual's signature and license number; stamped signature is prohibited."}],"question":"Which statement correctly resolves this common exam-trap issue?\n\nRubber stamps may sometimes supply other information, but a stamped signature is expressly prohibited in the cited rule.","topic":"Installation Labels","cat":3}];
const CATS=["Money & Fees","License to Work","Firm Business","On the Job","Know Your Code","Texas Rules"];
const $=x=>document.getElementById(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),cash=n=>(n<0?"−":"")+"$"+Math.abs(n).toLocaleString();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let players=[],turn=0,round=1,board=[],used=new Set,missed=[],current,stake,locked=false,sound=false,ac,finalQ,fi,wagers=[],results=[];
function beep(ok){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=ok?660:160;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3)}catch{}}
$("sound").onclick=()=>{sound=!sound;$("sound").textContent="Sound "+(sound?"on":"off");beep(true)};
$("new").onclick=()=>{if(!players.length||confirm("End this game?"))setup()};
function scores(){return '<div class="scores">'+players.map((p,i)=>'<div class="score '+(i===turn?'active':'')+'">'+esc(p.name)+'<strong>'+cash(p.score)+'</strong></div>').join('')+'</div>'}
function setup(){players=[];$("app").innerHTML='<section class="panel"><div class="small">GABE’S TFM01 • 471 STUDY QUESTIONS</div><h2>Your study night. Game show rules.</h2><p>Choose your categories, uncover Daily Doubles, and wager your points in the final challenge.</p><label for="names">1–3 player names, separated by commas</label><input id="names" value="Gabe"><div class="actions"><button class="gold" id="start">LET’S PLAY →</button></div><details><summary>How to play and AirPlay to the TV</summary><p>Correct answers add points. Wrong answers subtract points. Family players take turns choosing and answering. There are two 30-clue boards, then a final wager. Missed questions appear in the end-of-game review.</p><p>Open this page on your iPhone. On the same Wi-Fi as your AirPlay-compatible TV, open Control Center → Screen Mirroring → select the TV. Turn your phone sideways for the wide board. Everyone sees the same screen and answer choices.</p><p>Higher values favor harder questions where available. This is independent exam practice, not an official test or certification.</p></details></section>';$("start").onclick=()=>{players=$("names").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,3).map(name=>({name,score:0}));if(!players.length)players=[{name:"Gabe",score:0}];round=1;turn=0;used=new Set;missed=[];makeBoard();render()}}
function makeBoard(){board=[];for(let c=0;c<6;c++){let pool=shuffle(BANK.filter(q=>q.cat===c&&!used.has(q.id)));pool.sort((a,b)=>({Easy:0,Moderate:1,Difficult:2}[a.difficulty]??1)-({Easy:0,Moderate:1,Difficult:2}[b.difficulty]??1));for(let row=0;row<5;row++){let q=shuffle(pool.slice(Math.floor(row*pool.length/5),Math.floor((row+1)*pool.length/5)))[0];used.add(q.id);board.push({q,row,c,value:200*round*(row+1),done:false,dd:false})}}shuffle(board.filter(t=>t.row>0)).slice(0,round).forEach(t=>t.dd=true)}
function render(){$("app").innerHTML=scores()+'<p>'+esc(players[turn].name)+', choose a clue. <span class="small">Round '+round+' · '+board.filter(t=>t.done).length+'/30</span></p><div class="board">'+CATS.map(c=>'<div class="cat">'+c+'</div>').join('')+Array.from({length:5},(_,r)=>board.filter(t=>t.row===r).map(t=>'<button class="tile" data-t="'+board.indexOf(t)+'" '+(t.done?'disabled':'')+' aria-label="'+CATS[t.c]+' '+cash(t.value)+'">'+(t.done?'·':cash(t.value))+'</button>').join('')).join('')+'</div>';$("app").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{current=board[Number(b.dataset.t)];stake=current.value;locked=false;if(current.dd){beep(true);wager("DAILY DOUBLE",Math.max(players[turn].score,round*1000),n=>{stake=n;clue()})}else clue()})}
function wager(title,max,next){$("app").innerHTML=scores()+'<section class="panel"><h2>'+title+'</h2><p>'+esc(players[turn].name)+' · '+CATS[(title==="DAILY DOUBLE"?current.q:finalQ).cat]+'</p><label for="bet">Your wager: $0–'+max+'</label><input id="bet" type="number" min="0" max="'+max+'" step="1" value="0"><p id="error" role="alert"></p><div class="actions"><button class="gold" id="lock">Lock wager →</button></div></section>';$("lock").onclick=()=>{let n=Number($("bet").value);if(!Number.isInteger(n)||n<0||n>max){$("error").textContent="Enter a whole number within the limit.";return}next(n)}}
function clue(){let q=current.q;$("app").innerHTML=scores()+'<section class="panel"><div class="small">'+CATS[q.cat]+' · '+cash(stake)+'</div><h2>'+esc(q.question)+'</h2><div class="answers">'+shuffle(q.options).map(o=>'<button data-a="'+o.key+'">'+esc(o.text)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></section>';$("app").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(locked)return;locked=true;let ok=b.dataset.a===q.correct;players[turn].score+=ok?stake:-stake;current.done=true;if(!ok)missed.push(q);beep(ok);$("app").querySelectorAll("[data-a]").forEach(x=>{x.disabled=true;if(x.dataset.a===q.correct)x.classList.add("good");else if(x===b)x.classList.add("bad")});$("feedback").innerHTML='<div class="feedback"><b>'+(ok?'Correct! +':'Not this time. −')+cash(stake)+'</b><p>'+esc(q.explanation)+'</p><div class="small">'+esc(q.id)+' · '+esc(q.citation)+'</div></div><div class="actions"><button class="gold" id="next">Continue →</button></div>';$("next").onclick=()=>{turn=(turn+1)%players.length;if(board.every(t=>t.done)){if(round===1){round=2;makeBoard();render()}else startFinal()}else render()}})}
function startFinal(){finalQ=shuffle(BANK.filter(q=>!used.has(q.id)))[0];fi=0;wagers=[];results=[];finalBet()}
function finalBet(){turn=fi;wager("FINAL CHALLENGE",Math.max(0,players[turn].score),n=>{wagers.push(n);fi++;if(fi<players.length)finalBet();else{fi=0;finalAnswer()}})}
function finalAnswer(){turn=fi;$("app").innerHTML='<section class="panel"><div class="small">FINAL CHALLENGE · '+esc(players[turn].name)+'</div><h2>'+esc(finalQ.question)+'</h2><p class="small">Answers are revealed after everyone has submitted.</p><div class="answers">'+finalQ.options.map(o=>'<button data-f="'+o.key+'">'+esc(o.text)+'</button>').join('')+'</div></section>';$("app").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{results.push(b.dataset.f===finalQ.correct);fi++;if(fi<players.length)finalAnswer();else{players.forEach((p,i)=>p.score+=results[i]?wagers[i]:-wagers[i]);if(results.some(x=>!x))missed.push(finalQ);finish()}})}
function finish(){let top=Math.max(...players.map(p=>p.score));let winners=players.filter(p=>p.score===top).map(p=>p.name).join(" & ");beep(true);$("app").innerHTML='<section class="panel"><div class="small">BOARD COMPLETE</div><h2>'+esc(winners)+' takes the board!</h2>'+scores()+'<div class="feedback"><b>Final answer: '+esc(finalQ.options.find(o=>o.key===finalQ.correct).text)+'</b><p>'+esc(finalQ.explanation)+'</p><span class="small">'+esc(finalQ.citation)+'</span></div><p>'+players.map((p,i)=>esc(p.name)+': '+(results[i]?'+':'−')+cash(wagers[i])).join(' · ')+'</p><button class="gold" id="again">Play again</button><details open><summary>Review missed clues ('+missed.length+')</summary>'+missed.map(q=>'<p><b>'+esc(q.question)+'</b><br>'+esc(q.explanation)+'<br><span class="small">'+esc(q.citation)+'</span></p>').join('')+'</details></section>';$("again").onclick=setup()}
setup();
</script></html>
