<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gabe's TFM01 Game Board</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(at top,#223b96,#060b2d);color:white;font:18px system-ui;min-height:100vh}main{max-width:1500px;margin:auto;padding:20px}h1{font-size:clamp(28px,5vw,60px);margin:10px 0;color:#ffcf68}h2{font-size:clamp(22px,3vw,40px)}p{line-height:1.6;color:#c8d3ff}button,input{font:inherit;border-radius:10px;padding:14px;background:#203783;border:1px solid #687fc2;color:white;min-height:48px}button{cursor:pointer;font-weight:750}button:hover{filter:brightness(1.25)}button:disabled{opacity:.3}button:focus-visible{outline:3px solid #ffcf68}input{max-width:100%}.panel{background:#111b49;border:1px solid #425993;border-radius:22px;padding:30px;max-width:1000px;margin:25px auto}.gold{background:#ffcf68;color:#101634}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.cat{text-align:center;font-size:clamp(10px,1.5vw,22px);font-weight:900;padding:10px 3px;background:#10194b;display:grid;place-items:center}.tile{color:#ffcf68;font-size:clamp(19px,3.6vw,52px);min-height:10vh;padding:12px 2px;background:linear-gradient(#2349b6,#142570)}.scores{display:flex;gap:12px;margin:15px 0;flex-wrap:wrap}.score{flex:1;padding:12px;border:1px solid #647bb8;border-radius:12px}.active{border:2px solid #ffcf68}.score strong{display:block;font-size:26px;color:#ffcf68}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{text-align:left}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.good{background:#14613e!important}.bad{background:#842c40!important}.small{font-size:13px;color:#afbee8}label{display:block;margin:15px 0}details{margin-top:20px}summary{cursor:pointer}.feedback{padding:20px;background:#090f31;border-radius:12px;margin-top:18px}.trap-word{background:#ffcf68;color:#101634;border-radius:.2em;padding:0 .12em;font-weight:900}header{display:flex;justify-content:space-between;align-items:center;gap:10px}header>div{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:650px){main{padding:8px}.panel{padding:18px}.answers{grid-template-columns:1fr}.board{gap:3px}.cat{font-size:10px}.score{padding:6px}.score strong{font-size:20px}header button{font-size:12px;padding:8px}}@media(max-height:550px) and (orientation:landscape){header h1{font-size:24px}.scores{margin:5px 0}.score{padding:4px}.tile{min-height:8vh;padding:4px}.cat{padding:4px}.panel{margin:10px auto}}
</style><main><header><h1>BEAT THE BOARD</h1><div><button id="traps">Trap words on</button><button id="sound">Sound off</button><button id="new">New game</button></div></header><div id="app"></div></main><script src="question-bank.js"></script><script>
const BANK=window.TFM01_BANK;
const CATS=window.TFM01_CATEGORIES;
const $=x=>document.getElementById(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),cash=n=>(n<0?"−":"")+"$"+Math.abs(n).toLocaleString();
const TRAP_WORDS=/\b(may not|must not|shall not|is not|are not|may|must|shall|not|except|only|unless|before|after|within|who|when)\b/gi;
function trapText(x){let safe=esc(x);return trapHelp?safe.replace(TRAP_WORDS,'<mark class="trap-word">$1</mark>'):safe}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let players=[],turn=0,round=1,board=[],used=new Set,missed=[],current,stake,locked=false,sound=false,trapHelp=true,ac,finalQ,fi,wagers=[],results=[];
function beep(ok){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=ok?660:160;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3)}catch{}}
$("sound").onclick=()=>{sound=!sound;$("sound").textContent="Sound "+(sound?"on":"off");beep(true)};
$("traps").onclick=()=>{trapHelp=!trapHelp;$("traps").textContent="Trap words "+(trapHelp?"on":"off")};
$("new").onclick=()=>{if(!players.length||confirm("End this game?"))setup()};
function scores(){return '<div class="scores">'+players.map((p,i)=>'<div class="score '+(i===turn?'active':'')+'">'+esc(p.name)+'<strong>'+cash(p.score)+'</strong></div>').join('')+'</div>'}
function setup(){players=[];$("app").innerHTML='<section class="panel"><div class="small">GABE’S TFM01 • '+BANK.length+' STUDY QUESTIONS • EXPANDED BANK</div><h2>Your study night. Game show rules.</h2><p>Choose your clues, uncover Daily Doubles, and wager your points in the final challenge.</p><label for="names">1–3 player names, separated by commas</label><input id="names" value="Gabe"><div class="actions"><button class="gold" id="start">LET’S PLAY →</button></div><details><summary>How to play and AirPlay to the TV</summary><p>Correct answers add points. Wrong answers subtract points. Family players take turns choosing and answering. There are two 30-clue boards drawn from an expanded '+BANK.length+'-question bank, then a final wager. Missed questions appear in the end-of-game review.</p><p>Open this page on your iPhone. On the same Wi-Fi as your AirPlay-compatible TV, open Control Center → Screen Mirroring → select the TV. Turn your phone sideways for the wide board. Everyone sees the same screen and answer choices.</p><p>Higher values favor harder questions where available. This is independent exam practice, not an official test or certification.</p></details></section>';$("start").onclick=()=>{players=$("names").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,3).map(name=>({name,score:0}));if(!players.length)players=[{name:"Gabe",score:0}];round=1;turn=0;used=new Set;missed=[];makeBoard();render()}}
function makeBoard(){board=[];for(let c=0;c<6;c++){let pool=shuffle(BANK.filter(q=>q.cat===c&&!used.has(q.id)));pool.sort((a,b)=>({Easy:0,Moderate:1,Difficult:2}[a.difficulty]??1)-({Easy:0,Moderate:1,Difficult:2}[b.difficulty]??1));for(let row=0;row<5;row++){let q=shuffle(pool.slice(Math.floor(row*pool.length/5),Math.floor((row+1)*pool.length/5)))[0];used.add(q.id);board.push({q,row,c,value:200*round*(row+1),done:false,dd:false})}}shuffle(board.filter(t=>t.row>0)).slice(0,round).forEach(t=>t.dd=true)}
function render(){$("app").innerHTML=scores()+'<p>'+esc(players[turn].name)+', choose a clue. <span class="small">Round '+round+' · '+board.filter(t=>t.done).length+'/30</span></p><div class="board">'+CATS.map(c=>'<div class="cat">'+c+'</div>').join('')+Array.from({length:5},(_,r)=>board.filter(t=>t.row===r).map(t=>'<button class="tile" data-t="'+board.indexOf(t)+'" '+(t.done?'disabled':'')+' aria-label="'+CATS[t.c]+' '+cash(t.value)+'">'+(t.done?'·':cash(t.value))+'</button>').join('')).join('')+'</div>';$("app").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{current=board[Number(b.dataset.t)];stake=current.value;locked=false;if(current.dd){beep(true);wager("DAILY DOUBLE",Math.max(players[turn].score,round*1000),n=>{stake=n;clue()})}else clue()})}
function wager(title,max,next){$("app").innerHTML=scores()+'<section class="panel"><h2>'+title+'</h2><p>'+esc(players[turn].name)+' · '+CATS[(title==="DAILY DOUBLE"?current.q:finalQ).cat]+'</p><label for="bet">Your wager: $0–'+max+'</label><input id="bet" type="number" min="0" max="'+max+'" step="1" value="0"><p id="error" role="alert"></p><div class="actions"><button class="gold" id="lock">Lock wager →</button></div></section>';$("lock").onclick=()=>{let n=Number($("bet").value);if(!Number.isInteger(n)||n<0||n>max){$("error").textContent="Enter a whole number within the limit.";return}next(n)}}
function clue(){let q=current.q;$("app").innerHTML=scores()+'<section class="panel"><div class="small">'+CATS[q.cat]+' · '+cash(stake)+'</div><h2>'+trapText(q.question)+'</h2><div class="answers">'+shuffle(q.options).map(o=>'<button data-a="'+o.key+'">'+trapText(o.text)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></section>';$("app").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(locked)return;locked=true;let ok=b.dataset.a===q.correct;players[turn].score+=ok?stake:-stake;current.done=true;if(!ok)missed.push(q);beep(ok);$("app").querySelectorAll("[data-a]").forEach(x=>{x.disabled=true;if(x.dataset.a===q.correct)x.classList.add("good");else if(x===b)x.classList.add("bad")});$("feedback").innerHTML='<div class="feedback"><b>'+(ok?'Correct! +':'Not this time. −')+cash(stake)+'</b><p>'+esc(q.explanation)+'</p><div class="small">'+esc(q.id)+' · '+esc(q.citation)+'</div></div><div class="actions"><button class="gold" id="next">Continue →</button></div>';$("next").onclick=()=>{turn=(turn+1)%players.length;if(board.every(t=>t.done)){if(round===1){round=2;makeBoard();render()}else startFinal()}else render()}})}
function startFinal(){finalQ=shuffle(BANK.filter(q=>!used.has(q.id)))[0];fi=0;wagers=[];results=[];finalBet()}
function finalBet(){turn=fi;wager("FINAL CHALLENGE",Math.max(0,players[turn].score),n=>{wagers.push(n);fi++;if(fi<players.length)finalBet();else{fi=0;finalAnswer()}})}
function finalAnswer(){turn=fi;$("app").innerHTML='<section class="panel"><div class="small">FINAL CHALLENGE · '+esc(players[turn].name)+'</div><h2>'+trapText(finalQ.question)+'</h2><p class="small">Answers are revealed after everyone has submitted.</p><div class="answers">'+finalQ.options.map(o=>'<button data-f="'+o.key+'">'+trapText(o.text)+'</button>').join('')+'</div></section>';$("app").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{results.push(b.dataset.f===finalQ.correct);fi++;if(fi<players.length)finalAnswer();else{players.forEach((p,i)=>p.score+=results[i]?wagers[i]:-wagers[i]);if(results.some(x=>!x))missed.push(finalQ);finish()}})}
function finish(){let top=Math.max(...players.map(p=>p.score));let winners=players.filter(p=>p.score===top).map(p=>p.name).join(" & ");beep(true);$("app").innerHTML='<section class="panel"><div class="small">BOARD COMPLETE</div><h2>'+esc(winners)+' takes the board!</h2>'+scores()+'<div class="feedback"><b>Final answer: '+esc(finalQ.options.find(o=>o.key===finalQ.correct).text)+'</b><p>'+esc(finalQ.explanation)+'</p><span class="small">'+esc(finalQ.citation)+'</span></div><p>'+players.map((p,i)=>esc(p.name)+': '+(results[i]?'+':'−')+cash(wagers[i])).join(' · ')+'</p><button class="gold" id="again">Play again</button><details open><summary>Review missed clues ('+missed.length+')</summary>'+missed.map(q=>'<p><b>'+esc(q.question)+'</b><br>'+esc(q.explanation)+'<br><span class="small">'+esc(q.citation)+'</span></p>').join('')+'</details></section>';$("again").onclick=setup()}
setup();
</script></html>
