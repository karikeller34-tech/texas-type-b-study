<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TFM01 Chapter 6001 Drill</title><style>:root{--navy:#091542;--blue:#203f9b;--gold:#ffd36a;--ink:#f9fbff;--muted:#b8c8ef;--card:#121f57;--border:#5572bd;--good:#144f3b;--bad:#70293b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(at top,#2549ad,#050924 75%);color:var(--ink);font:18px system-ui,-apple-system,sans-serif}main{max-width:830px;margin:auto;padding:18px}h1{font-size:clamp(29px,6vw,50px);margin:8px 0;color:var(--gold)}h2{font-size:clamp(21px,4vw,31px);line-height:1.24}.panel{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:0 18px 40px #01031b88}.small{font-size:14px;color:var(--muted)}.why{background:#0a1238;border-left:4px solid var(--gold);padding:15px;border-radius:10px;line-height:1.5}.progress{height:11px;background:#071032;border-radius:99px;overflow:hidden;margin:15px 0}.progress span{height:100%;display:block;background:var(--gold)}button{font:inherit;font-weight:800;color:#fff;background:#2548a8;border:1px solid #6d88d2;padding:13px 16px;border-radius:12px;min-height:50px;cursor:pointer}button:hover{filter:brightness(1.13)}button.gold{background:var(--gold);color:#07123b;border-color:#ffe5a4}.answers{display:grid;gap:11px;margin:20px 0}.answer{text-align:left;background:#213b8d}.answer.correct{background:var(--good);border-color:#56ce9b}.answer.wrong{background:var(--bad);border-color:#ee879d}.feedback{background:#071034;border-radius:13px;padding:17px;line-height:1.5;margin:15px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}.section-list{display:grid;gap:10px;margin-top:16px}.section-list button{text-align:left}.stat{display:inline-block;background:#ffffff16;border-radius:99px;padding:6px 10px;margin:3px;font-size:13px}.hidden{display:none!important}@media(max-width:560px){main{padding:10px}.panel{border-radius:16px}.row button{min-width:100%}}</style></head><body><main><h1>6001 MEMORY DRILL</h1><div id="app"></div></main><script>const SECTIONS=[["6001.001", "Purpose", "This tells him which work is regulated and why the equipment has to be listed. It is the legal reason an extinguisher company cannot just service anything.", [["Which actions are regulated for a portable fire extinguisher?", ["Planning, certifying, installing, and servicing", "Leasing, selling, installing, and servicing", "Selling, certifying, designing, and inspecting", "Inspecting, planning, charging, and labeling"], 1, "Portable = <b>L-S-I-S</b>: lease, sell, install, service."], ["What extra two actions are regulated for fixed fire extinguisher systems?", ["Planning and certifying", "Leasing and selling", "Inspecting and charging", "Advertising and bidding"], 0, "Fixed systems need a <b>Plan + Certificate</b> before install/service."], ["What may Chapter 6001 prohibit if the department-approved laboratory has not listed it?", ["Only portable extinguishers", "Only fixed systems", "Portable extinguishers, fixed systems, or extinguisher equipment", "Only carbon dioxide systems"], 2, "<b>No approved listing = no go.</b>"]]], ["6001.002", "Definitions", "This defines the words the rest of the chapter uses. \u201cInspection\u201d is much smaller than \u201cservice,\u201d which matters in real work and on test questions.", [["What is a \u201cfirm\u201d under Chapter 6001?", ["Only a corporation", "An individual, partnership, corporation, or association", "Only a licensed business with employees", "Any insurance agent"], 1, "<b>IPCA</b>: Individual, Partnership, Corporation, Association."], ["What three things are checked in the monthly portable-extinguisher inspection?", ["Pressure, tag color, and purchase date", "Location, no actuation/tampering, and no obvious damage/operating problem", "Hydrostatic test date, label, and agent weight", "License, permit, and insurance"], 1, "<b>Place \u2013 Pin \u2013 Physical.</b>"], ["Which activity is \u201cservice\u201d rather than merely an inspection?", ["Checking whether an extinguisher is in its location", "Charging, filling, maintaining, recharging, refilling, repairing, or testing", "Looking for tampering", "Checking for obvious damage"], 1, "Service is hands-on work. Inspection is the monthly look-over."]]], ["6001.051", "Administration", "This explains who runs the program. It matters because questions can switch Department, Commissioner, and State Fire Marshal.", [["Who shall administer Chapter 6001?", ["The State Fire Marshal personally", "The department", "PSI", "NFPA"], 1, "<b>Department drives.</b>"], ["Who may issue necessary rules through the State Fire Marshal?", ["The commissioner", "Every registered firm", "A testing laboratory", "The insurance agent"], 0, "<b>Commissioner writes; Fire Marshal carries it out.</b>"]]], ["6001.052", "Adoption of Rules", "This explains where Texas can get its standards and what the commissioner is required to regulate.", [["Which source is NOT one the commissioner may use as a recognized standard?", ["NFPA", "Federal law or regulation", "Manufacturer installation manuals", "A customer\u2019s preferred procedures"], 3, "<b>N-F-N-M</b>: NFPA, Federal, National organization, Manufacturer."], ["What does the commissioner have a duty to adopt and administer?", ["Rules essentially necessary to protect life and property", "Any rule a firm requests", "Only advertising rules", "Only fee rules"], 0, "<b>May use sources; shall protect life/property.</b>"], ["What must the commissioner prescribe for licenses, permits, and certificates?", ["Application and qualification requirements", "The exact PSI test questions", "Only the renewal price", "The applicant\u2019s employer"], 0, "Think <b>Apply + Qualify</b>."]]], ["6001.053", "Advertising and Competitive Bidding", "This protects a company\u2019s ability to advertise and bid, while still allowing rules against dishonest ads.", [["When may the commissioner restrict advertising or competitive bidding?", ["Whenever competition gets too intense", "Only to prohibit false, misleading, or deceptive practices", "Whenever an advertisement uses a trade name", "Whenever an advertisement is online"], 1, "<b>F-M-D is the only door:</b> False, Misleading, Deceptive."], ["Which advertising feature may NOT be restricted even in a false/misleading/deceptive rule?", ["A false claim", "Use of a trade name", "A deceptive statement", "Misleading content"], 1, "Remember <b>M-V-S-T</b>: Medium, Voice/appearance, Size/duration, Trade name."]]], ["6001.054", "General Powers and Duties of Department", "This is the Department\u2019s gatekeeper job: decide who qualifies, then issue the right credential.", [["What two kinds of firms does the department evaluate under this section?", ["Firms applying for registration and firms seeking testing-lab approval", "Only branch offices and insurance agents", "Only PSI testing centers and fire departments", "Only manufacturers and retailers"], 0, "<b>Work firm or test lab.</b>"], ["Which is NOT among the credentials/authorizations the department may issue to qualifying applicants?", ["Registration certificate", "Apprentice permit", "Hydrostatic-testing authorization", "A college degree"], 3, "<b>R-L-P-H:</b> Registration, License, Permit, Hydro."]]], ["6001.055", "Fees", "This is the statute\u2019s maximum-fee chart. The word \u201cmaximum\u201d matters because the rule may show a different current two-year fee.", [["What is the maximum initial firm registration fee?", ["$100", "$250", "$450", "$600"], 2, "<b>Firm is first and biggest: 450.</b>"], ["What is the maximum annual firm-registration renewal fee?", ["$100", "$150", "$300", "$600"], 2, "<b>450 to start; 300 each year.</b>"], ["What is the maximum initial DOT hydrostatic-testing registration fee?", ["$100", "$150", "$250", "$450"], 2, "<b>DOT starts at 250.</b>"], ["What is the maximum initial employee-license fee and annual renewal fee?", ["$70 initial and $50 renewal", "$50 initial and $70 renewal", "$30 initial and $20 renewal", "$100 initial and $100 renewal"], 0, "<b>70 then 50.</b>"], ["If the exam is not administered by a testing service, what is the maximum reexamination fee?", ["$0", "$20", "$30", "$50"], 1, "The fee ladder ends <b>30 initial exam, 20 reexam.</b>"]]], ["6001.056", "Deposit in Operating Account", "This is money-handling law, not field servicing. It may appear as a simple exception question.", [["Where is Chapter 6001 money deposited?", ["The State Fire Marshal personal account", "The TDI operating account in the state treasury", "A national NFPA account", "The local fire department"], 1, "<b>Fees fuel the office.</b>"], ["Which money is excluded from that deposit rule?", ["Registration fees", "License fees", "Penalties and monetary forfeitures", "Duplicate-certificate fees"], 2, "The complete hook is: <b>Fees fuel the office; penalties do not.</b>"]]], ["6001.151", "Firm Registration Certificate Required", "This is the company-level permission to do regulated work. Gabe\u2019s own employee license does not replace it.", [["Before a firm may install or service portable extinguishers, what must it hold?", ["A firm registration certificate", "Only an employee license", "Only a branch certificate", "An apprentice permit"], 0, "<b>Firm first.</b>"], ["Which fixed-system activity requires the firm certificate under this statute?", ["Planning, certifying, installing, or servicing", "Only selling", "Only advertising", "Only monthly inspection"], 0, "Fixed systems are the <b>P-C-I-S</b> list."]]], ["6001.152", "Branch Office Registration Certificate Required", "This is for a separate business location. The test may ask whether a truck or employee counts as a branch. It does not.", [["When does a registered firm need a branch-office certificate?", ["For every service truck", "For each separate office location other than the location on the firm certificate", "For every employee", "Only when the firm sells extinguishers"], 1, "<b>New office address, new branch paper.</b>"], ["What must the department determine before issuing a branch certificate?", ["That the branch is part of a registered firm", "That the branch has a Type PL employee", "That the branch has a fire engine", "That the branch has its own insurance policy"], 0, "The branch must link back to the registered firm."]]], ["6001.153", "DOT Hydrostatic Testing", "This differentiates DOT cylinders from non-DOT cylinders. That distinction has real safety consequences.", [["For DOT-specification cylinder testing, whose procedures must the firm follow?", ["NFPA only", "United States Department of Transportation procedures for compressed-gas cylinders", "The customer\u2019s procedures", "The local building code only"], 1, "<b>DOT means DOT rules.</b>"], ["What must the firm hold to do DOT hydrostatic testing?", ["An apprentice permit", "A State Fire Marshal registration certificate authorizing hydrostatic testing", "Only a portable-extinguisher license", "A branch certificate"], 1, "<b>DOT = DOT procedures + DOT certificate + DOT authority on the license.</b>"], ["What standard governs hydrostatic testing that is not performed under DOT specifications?", ["NFPA recommendations", "OSHA only", "Manufacturer preference only", "No standard applies"], 0, "<b>No DOT? NFPA.</b>"]]], ["6001.154", "Insurance", "This keeps a registered company financially responsible if its regulated work causes injury or property damage.", [["What coverage must the liability policy include?", ["Flood and earthquake coverage", "Products and completed operations coverage", "Workers\u2019 compensation only", "Automobile-only coverage"], 1, "<b>P + CO</b>: Products + Completed Operations."], ["What is the minimum combined single limit for bodily injury/property damage for each occurrence?", ["$50,000", "$100,000", "$300,000", "$1,000,000"], 1, "<b>100 per fire.</b>"], ["What is the minimum aggregate coverage for one policy year?", ["$100,000", "$200,000", "$300,000", "$1,000,000"], 2, "<b>300 for the year.</b>"], ["What can failure to maintain required insurance support after notice and opportunity for hearing?", ["Automatic criminal conviction only", "Denial, suspension, or revocation of the registration certificate", "Free renewal", "A new branch certificate"], 1, "No coverage can threaten the firm\u2019s certificate."]]], ["6001.155", "Employee License Required", "This is Gabe\u2019s personal permission to do regulated work. The firm must be registered too.", [["Who generally must hold an employee license before covered extinguisher work?", ["Any individual other than an apprentice, unless \u00a76001.156 applies", "Only the firm owner", "Only a testing laboratory employee", "No one if a firm is registered"], 0, "<b>Firm certificate + person license.</b>"], ["Where must a licensed person work?", ["For any company they choose", "As an employee or agent of a registered firm", "Only for a fire department", "Only as an independent contractor"], 1, "<b>License has a firm home.</b>"], ["Which activity is listed for a non-preengineered fixed system?", ["Planning, supervising, servicing, or certifying installation", "Leasing it to a customer", "Selling a listed extinguisher", "Monthly visual inspection only"], 0, "The phrase \u201cother than preengineered\u201d signals the broader fixed-system work list."]]], ["6001.156", "Activities Not Regulated by Chapter", "This is the exception section. Most traps happen because an answer expands one narrow exception too far.", [["What may a building owner, managing agent, or their employee install under this exemption?", ["Any fixed suppression system", "Portable extinguishers in the owner\u2019s building", "Portable extinguishers in any customer building", "Any extinguisher system for a fee"], 1, "<b>Owner + own building + portable only.</b>"], ["Does a retail/wholesale seller of listed portable extinguishers need to be licensed under this chapter if it does not install or service them?", ["Yes, always", "No", "Only if it sells more than 10", "Only if it advertises"], 1, "<b>Sales only = exception.</b> The extinguisher must carry an approved-lab listing."], ["May a fire department service portable extinguishers under the exception?", ["Yes, if it is public service without charge and members are trained", "Yes, for any fee", "No, never", "Only outside Texas"], 0, "<b>Fire department: free + trained.</b>"], ["Except for listed exemptions, who may install/service portable extinguishers or install/maintain fixed systems?", ["Anyone employed by a building owner", "Only a holder of a license or apprentice permit under this chapter", "Only an insurance agent", "Only an engineer"], 1, "Exceptions are narrow; the default is <b>license or apprentice permit.</b>"]]], ["6001.157", "License Examination", "This shows why PSI can administer the exam but does not make the test law up on its own.", [["Who shall establish the scope and type of the license examination?", ["PSI", "The State Fire Marshal", "NFPA", "The applicant\u2019s employer"], 1, "<b>Marshal owns the test; PSI can run it.</b>"], ["May the State Fire Marshal use a testing service?", ["No, never", "Yes, the Marshal may administer it or contract with a testing service", "Only if every applicant agrees", "Only for renewals"], 1, "The key word is <b>may</b>."], ["Which is a testing-service duty the Marshal may contract for?", ["Grading and reporting", "Changing the statute", "Issuing a building permit", "Writing NFPA standards"], 0, "PSI-type chores: <b>develop, schedule, site, grade, report, analyze, admin.</b>"]]], ["6001.158", "Examination Results", "This is directly relevant to Gabe because it explains result timing and the limited report he can request after a failure.", [["Normally, by when must exam-result notice be sent?", ["14 days after the exam", "30th day after the exam", "90th day after the exam", "One year after the exam"], 1, "<b>30 after the exam.</b>"], ["When a testing service conducted, graded, or reviewed the exam, by when must the Marshal send notice?", ["14 days after the Marshal receives results from the service", "14 days after the exam", "30 days after the service gets the exam", "90 days after the exam"], 0, "<b>14 after PSI results reach the Marshal.</b>"], ["If results will be delayed more than 90 days, what must happen before day 90?", ["The examinee receives an answer key", "The examinee gets notice of the reason for delay", "The exam is automatically passed", "A new test is scheduled"], 1, "<b>Warn before 90.</b>"], ["What may a person who fails request in writing?", ["The secure question bank", "An analysis of that person\u2019s examination performance", "A free license", "The names of passing examinees"], 1, "This is why the score report breaks down categories but does not show secure questions."]]], ["6001.159", "Continuing Education", "This is a simple may-versus-must test point.", [["Is continuing education participation mandatory under this statute?", ["Yes", "No, it is voluntary", "Only for apprentices", "Only after a failed test"], 1, "<b>CE = Can Elect.</b>"], ["What may the commissioner do concerning continuing education?", ["Certify programs and adopt procedures", "Require every applicant to take a college class", "Give out test answers", "Eliminate all licenses"], 0, "<b>May certify; voluntary attendance.</b>"]]], ["6001.160", "Reciprocal License", "This can help an out-of-state applicant, but it is not automatic.", [["When may the department waive a Texas license requirement for an out-of-state license holder?", ["Whenever the applicant paid a fee", "When the other state\u2019s requirements are substantially equivalent", "Whenever the applicant has worked one year", "Never"], 1, "<b>Reciprocal = same standards, different state.</b>"], ["Is a waiver mandatory for every out-of-state license?", ["Yes", "No, the department may waive when requirements are substantially equivalent", "Only if the applicant asks three times", "Only for apprentices"], 1, "Trap word: <b>may</b>, not shall."]]], ["6001.161", "Apprentice Permit Required", "This tells Gabe what he could do as an apprentice and why \u201csame firm\u201d is a real restriction.", [["What must a person hold before doing covered work as an apprentice?", ["A department-issued apprentice permit", "Only a driver\u2019s license", "A branch certificate", "An insurance certificate"], 0, "<b>Permit first.</b>"], ["Who may directly supervise the apprentice?", ["Any licensed person in Texas", "A licensed individual who works for the same firm", "Any building owner", "A customer\u2019s fire marshal"], 1, "<b>Permit + Pro + same Place.</b>"]]], ["6001.162", "Not Transferable", "This is a short rule that is easy to ask as a true/false question.", [["Which credentials are not transferable?", ["Only licenses", "Only apprentice permits", "Registration certificates, licenses, and permits", "Only branch certificates"], 2, "<b>R-L-P stays put:</b> Registration, License, Permit."]]], ["6001.201", "Renewal Required; Fee", "This separates the normal two-year credential cycle from the one-year apprentice permit and the rare prorated first period.", [["How long is a renewed registration certificate or license valid?", ["One year", "Two years", "Three years", "Five years"], 1, "<b>Registration/license = 2.</b>"], ["When does an apprentice permit expire?", ["After 90 days", "On the first anniversary of issuance", "On the second anniversary", "Never"], 1, "<b>Apprentice = 1.</b>"], ["When may a fee be prorated monthly under this section?", ["Every renewal", "When the first validity period is less than a year because of staggered expiration dates", "Whenever an applicant asks", "Only after the credential is expired"], 1, "<b>2\u20131\u2013partial.</b> Only the first short period can be prorated."]]], ["6001.202", "Notice of Expiration", "This is the State Fire Marshal\u2019s notice duty. Know the date and where the notice goes.", [["How far before expiration must written notice be sent?", ["14 days", "30 days", "90 days", "Two years"], 1, "<b>30 to the door.</b>"], ["Where is the notice sent?", ["The address on the first application only", "The holder\u2019s last known address", "The testing center", "The local fire department"], 1, "Complete hook: <b>30 to the last known door.</b>"]]], ["6001.203", "Renewal Procedures", "This is one of the most testable timing sections: 90 days versus two years, plus half initial fee versus full initial fee.", [["What does a credential holder with an unexpired credential do to renew?", ["Pay the renewal fee before expiration", "Pay a new initial fee", "Retake the exam", "Wait 30 days"], 0, "<b>Still alive? Renew before the date.</b>"], ["If expired 90 days or less, what is owed?", ["Renewal fee plus one-half of the initial fee", "All unpaid renewals plus full initial fee", "No fee", "A new application only"], 0, "<b>90 = half.</b>"], ["If expired more than 90 days but less than two years, what is owed?", ["Only the renewal fee", "All unpaid renewal fees plus the full initial fee", "One-half initial fee only", "Nothing if the firm is registered"], 1, "<b>Past 90 = full initial fee.</b>"], ["What happens after two years or longer of expiration?", ["Renew normally", "Renew with a double fee", "Cannot renew; meet initial-application requirements for a new credential", "Only pay a late fee"], 2, "<b>2 = new.</b>"]]], ["6001.251", "Prohibited Practices", "This is the enforcement section tied to actual unsafe or unlicensed extinguisher work. It is the most directly related to servicing.", [["May a firm install or service portable extinguishers without a registration certificate?", ["Yes, if an employee has a license", "No", "Yes, for one customer", "Only if it is a branch office"], 1, "<b>Firm first, person second.</b>"], ["What extinguisher may not be sold, installed, serviced, or recharged?", ["CO\u2082", "Carbon tetrachloride", "Water mist", "Dry chemical"], 1, "The technical trap is <b>carbon tetrachloride</b>, not carbon dioxide."], ["What is prohibited regarding DOT-specification hydrostatic testing?", ["Testing without a hydrostatic-testing registration certificate", "Testing with DOT procedures", "Testing under a proper license", "Testing a non-DOT cylinder according to NFPA recommendations"], 0, "<b>DOT needs its certificate.</b>"], ["What label problem can generally make covered equipment illegal to lease, sell, service, or install?", ["It lacks an approval or listing label from a department-approved testing lab", "Its tag is blue", "Its owner moved", "It has a handwritten serial number"], 0, "<b>Approved listing label.</b> Remember: the statute requires a rule that permits service regardless of this label, a narrow exception."]]], ["6001.252", "Disciplinary Actions", "This is the State Fire Marshal\u2019s authority to act against credentials after procedural protections.", [["What four credential actions may the State Fire Marshal take after notice and hearing?", ["Suspend, revoke, refuse to issue, or refuse to renew", "Fine, jail, deport, or close a building", "Only suspend or revoke", "Only require retesting"], 0, "<b>S-R-R-R:</b> Suspend, Revoke, Refuse issue, Refuse renew."], ["Which conduct can support discipline?", ["Violation of Chapter 6001, rules/standards, or sales/service misrepresentation", "Only failing one PSI exam", "Only changing jobs", "Only advertising a trade name"], 0, "Think <b>Law \u2013 Rules \u2013 Misrepresentation.</b>"]]], ["6001.253", "Disciplinary Hearing", "This is procedural law: it tells the license holder where the case is heard.", [["Where is a Chapter 6001 disciplinary hearing conducted?", ["At PSI", "At the State Office of Administrative Hearings", "At NFPA headquarters", "At the customer\u2019s location"], 1, "<b>Discipline goes to SOAH.</b>"], ["What governs disciplinary proceedings?", ["Government Code Chapter 2001", "NFPA 10 only", "Federal criminal code only", "The company handbook"], 0, "The commissioner\u2019s practice rules cannot conflict with SOAH rules."]]], ["6001.254", "Reapplication Requirements", "This is not Gabe\u2019s ordinary exam-failure rule. It applies to refusal or revocation, and expressly makes exam failure different.", [["After a refusal or revocation, how long must a person generally wait to reapply?", ["30 days", "90 days", "One year from the effective date", "Two years"], 2, "<b>Revoked? One-year roadblock.</b>"], ["What important situation is excluded from the one-year reapplication bar?", ["Failure to pass a required written examination", "Failure to maintain insurance", "Fraudulent application", "Rule violation"], 0, "<b>Failed exam = different road.</b>"], ["After the first anniversary, what must the applicant show at a public hearing?", ["Good cause that issuance is not against public safety and welfare", "That the old test was unfair", "That the employer will pay fees", "That NFPA approved the applicant"], 0, "<b>One year, then good cause.</b>"]]], ["6001.255", "Reexamination After Revocation", "This works with \u00a76001.254: one tells the waiting rule; this one tells the exam requirement after revocation.", [["What must a revoked service/install license holder do before a new license may issue?", ["Retake and pass the required written exam", "Only pay a duplicate fee", "Get an apprentice permit", "Wait 30 days"], 0, "<b>Revoked = re-test.</b>"]]], ["6001.301", "Criminal Penalty", "This connects knowingly breaking the prohibited-practices list to a criminal offense.", [["Knowingly violating \u00a76001.251(a) is what class of offense?", ["Class A misdemeanor", "Class B misdemeanor", "Felony", "Civil infraction only"], 1, "<b>B violation = Class B.</b>"], ["Where may the criminal case be brought?", ["Only Travis County", "Only the county of the offense", "Travis County or the county in which the offense occurred", "Any county in Texas"], 2, "<b>Two places: Travis or the breach county.</b>"]]]];let sec=0,q=0,score=0,answered=false;const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){sec=0;q=0;score=0;answered=false;$('app').innerHTML=`<section class="panel"><div class="small">${SECTIONS.length} STATUTES · ${SECTIONS.reduce((n,s)=>n+s[3].length,0)} SHORT QUESTIONS</div><h2>Learn one statute at a time.</h2><p>Every level begins with why the statute matters in real extinguisher work. Then Gabe answers only small questions from that statute.</p><button class="gold" onclick="play(0)">START §6001.001 →</button><div class="section-list">${SECTIONS.map((s,i)=>`<button onclick="play(${i})">§${s[0]} · ${esc(s[1])}<br><span class="small">${s[3].length} questions</span></button>`).join('')}</div></section>`}function play(i){sec=i;q=0;answered=false;render()}function render(){let s=SECTIONS[sec],x=s[3][q],pct=(q/s[3].length)*100;$('app').innerHTML=`<section class="panel"><div class="small">§${s[0]} · ${esc(s[1])}</div><div class="progress"><span style="width:${pct}%"></span></div><div class="why"><b>Why Gabe needs this at work:</b><br>${esc(s[2])}</div><p class="small" style="margin-top:18px">QUESTION ${q+1} OF ${s[3].length} IN THIS STATUTE · TOTAL CORRECT: ${score}</p><h2>${esc(x[0])}</h2><div class="answers">${x[1].map((a,i)=>`<button class="answer" data-i="${i}" onclick="answer(${i})">${'ABCD'[i]}. ${esc(a)}</button>`).join('')}</div><div id="feedback"></div><div class="row"><button onclick="home()">All sections</button><button id="next" class="gold" onclick="next()" disabled>${q+1===s[3].length?(sec+1===SECTIONS.length?'Finish':'Next statute →'):'Next question →'}</button></div></section>`}function answer(i){if(answered)return;answered=true;let s=SECTIONS[sec],x=s[3][q],ok=i===x[2];if(ok)score++;document.querySelectorAll('.answer').forEach((b,n)=>{if(n===x[2])b.classList.add('correct');if(n===i&&!ok)b.classList.add('wrong');b.disabled=true});$('feedback').innerHTML=`<div class="feedback"><b>${ok?'Correct.':'Not this one.'}</b><br>${x[3]}</div>`;$('next').disabled=false}function next(){let s=SECTIONS[sec];if(q+1<s[3].length){q++;answered=false;render()}else if(sec+1<SECTIONS.length){sec++;q=0;answered=false;render()}else{$('app').innerHTML=`<section class="panel"><h2>Chapter 6001 complete.</h2><p>You got ${score} correct on this pass.</p><button class="gold" onclick="home()">Study again</button></section>`}}home();</script></body></html>
